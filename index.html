      '<div><label class="l">Clienta</label>' + (cl
        ? '<div class="elegida"><div><b>' + esc(cl.nombre) + '</b><div style="font-size:12.5px;color:var(--muted)">' + esc(cl.id + ' · ' + cl.whatsapp) + '</div></div>' + (ed ? '' : '<button class="btn btn-ghost btn-mini" type="button" id="gcCambiar">Cambiar</button>') + '</div>'
        : '<div class="buscar"><input id="gcB" placeholder="Busca a la clienta" autocomplete="off"><div class="sug" id="gcS" hidden></div></div>') + '</div>' +
      '<div class="dos"><div><label class="l" for="gcF">Fecha</label><input type="date" id="gcF" min="' + (ed ? '' : D.hoy) + '" value="' + esc(F.fecha) + '"></div>' +
      '<div><label class="l" for="gcH">Hora</label><input type="time" id="gcH" step="900" value="' + esc(F.hora) + '"></div></div>' +
      '<div class="rapidos" id="gcHoras">' + ['10:00', '11:00', '12:00', '13:00', '16:00', '17:00', '18:00'].map(h => '<button type="button" data-h="' + h + '">' + (Number(h.slice(0, 2)) % 12 || 12) + (h.slice(3) !== '00' ? ':' + h.slice(3) : '') + (Number(h.slice(0, 2)) < 12 ? ' am' : ' pm') + '</button>').join('') + '</div>' +
      '<div class="dos"><div><label class="l" for="gcSv">Servicio</label>' + botonServicio('id="gcSv"', F.serv, '—') + '</div>' +
      '<div><label class="l" for="gcD">Duración</label><select id="gcD">' + ((D.agenda && D.agenda.duraciones) || [30, 45, 60, 90, 120]).map(m => '<option value="' + m + '"' + (m === Number(F.dur) ? ' selected' : '') + '>' + (m < 60 ? m + ' min' : (m / 60) + ' h' + (m % 60 ? '' : '')).replace('1.5 h', '1 h 30').replace('1.25 h', '1 h 15') + '</option>').join('') + '</select></div></div>' +
      '<div><label class="l" for="gcA">Atiende</label><select id="gcA">' + opt(D.listas.atendio, F.atiende, 'Cualquiera') + '</select></div>' +
      '<div><label class="l" for="gcN">Notas</label><input id="gcN" maxlength="200" placeholder="Ej. viene con su hermana" value="' + esc(F.notas) + '"></div>' +
      '<div id="gcMsg"></div><button class="btn btn-prim" type="button" id="gcG" style="padding:13px">' + (ed ? 'Guardar cambios' : 'Agendar') + '</button></div>';
    const leer = () => { F.fecha = $('gcF').value; F.hora = $('gcH').value; F.serv = $('gcSv').value; F.dur = $('gcD').value; F.atiende = $('gcA').value; F.notas = $('gcN').value; };
    $('cerrar').onclick = () => { if (ed) abrirCita(c.id); else $('panel').hidden = true; };
    if ($('gcCambiar')) $('gcCambiar').onclick = () => { leer(); F.idc = ''; pintar(); };
    $('gcHoras').querySelectorAll('[data-h]').forEach(b => b.onclick = () => { $('gcH').value = b.dataset.h; });
    $('gcSv').onclick = () => elegirServicio($('gcSv').value, v => { leer(); F.serv = v; pintar(); }, true);
    if ($('gcB')) {
      const inp = $('gcB'), box = $('gcS');
      inp.oninput = () => {
        const q = norm(inp.value), qt = inp.value.replace(/\D/g, '');
        if (!q) { box.hidden = true; return; }
        const l = D.clientas.filter(x => norm(x.nombre).includes(q) || norm(x.id).includes(q) || (qt.length >= 3 && x.whatsapp.includes(qt))).slice(0, 8);
        box.innerHTML = l.length ? l.map(x => '<button type="button" data-id="' + esc(x.id) + '"><b>' + esc(x.nombre) + '</b><br><small>' + esc(x.id + ' · ' + x.whatsapp) + '</small></button>').join('')
          : '<button type="button" data-nueva="1"><b>+ Registrar nueva clienta</b><br><small>No hay nadie con «' + esc(inp.value) + '»</small></button>';
        box.hidden = false;
        box.querySelectorAll('[data-id]').forEach(b => b.onclick = () => { leer(); F.idc = b.dataset.id; pintar(); });
        const bn = box.querySelector('[data-nueva]');
        if (bn) bn.onclick = () => { leer(); const t = inp.value.trim(); abrirFormClienta(null, { nombre: /\d/.test(t) ? '' : t, whatsapp: t.replace(/\D/g, '') }, r => { F.idc = r.id; pintar(); }); };
      };
      setTimeout(() => inp.focus(), 50);
    }
    const guardarC = async forzar => {
      leer();
      const msg = (h, cl2) => $('gcMsg').innerHTML = h ? '<div class="aviso ' + (cl2 || 'bad') + '">' + h + '</div>' : '';
      if (!F.idc) return msg('Elige a la clienta.');
      if (!F.fecha) return msg('Elige la fecha.');
      if (!F.hora) return msg('Elige la hora.');
      const b = $('gcG'); b.disabled = true; b.textContent = 'Guardando…'; msg('');
      try {
        const r = await srv('guardarCita', { id: ed ? c.id : '', idClienta: F.idc, fecha: F.fecha, hora: F.hora, duracion: Number(F.dur), servicio: F.serv, atiende: F.atiende, notas: F.notas, forzar: !!forzar });
        if (r.empalme) {
          b.disabled = false; b.textContent = ed ? 'Guardar cambios' : 'Agendar';
          msg(esc(r.mensaje) + '<div class="chips" style="margin-top:8px"><button class="btn btn-ghost btn-mini" type="button" id="gcF2">Agendar de todos modos</button></div>', 'warn');
          $('gcF2').onclick = () => guardarC(true); return;
        }
        pitido(true); AG.fecha = F.fecha; refrescarCitas();
        $('panelIn').innerHTML = '<button class="volver" type="button" id="cerrar">← Volver</button><div style="text-align:center;padding-top:20px"><span class="chip ok">' + (ed ? 'Cita cambiada' : 'Cita agendada') + '</span>' +
          '<h1 class="ficha-nom" style="margin-top:10px">' + esc((clientaPorId(F.idc) || {}).nombre || '') + '</h1><div style="color:var(--muted)">' + esc(fechaLargaC(F.fecha)) + ' · ' + esc(F.hora) + '</div>' +
          '<div class="campos" style="margin-top:18px">' + (r.linkAviso ? '<a class="btn btn-wa" style="padding:12px" target="_blank" rel="noopener" href="' + esc(r.linkAviso) + '">Avisarle por WhatsApp</a>' : '') +
          '<button class="btn btn-sec" type="button" id="gcVer">Ver agenda</button></div></div>';
        $('cerrar').onclick = () => { $('panel').hidden = true; render(); };
        $('gcVer').onclick = () => { $('panel').hidden = true; tab = 'agenda'; render(); };
      } catch (e) { b.disabled = false; b.textContent = ed ? 'Guardar cambios' : 'Agendar'; msg(esc(errorTexto(e))); }
    };
    $('gcG').onclick = () => guardarC(false);
  };
  $('panel').hidden = false; $('panel').scrollTop = 0;
  pintar();
}

/* ---------- Corte de caja (dueña) ---------- */
async function abrirCorte(fecha) {
  $('panelIn').innerHTML = '<button class="volver" type="button" id="cerrar">← Volver</button><h1 class="ficha-nom">Corte de caja</h1><div class="carga"><span class="spin"></span>Calculando…</div>';
  $('panel').hidden = false; $('panel').scrollTop = 0;
  $('cerrar').onclick = () => { $('panel').hidden = true; };
  let C;
  try { C = await srv('obtenerCorte', fecha); }
  catch (e) { $('panelIn').insertAdjacentHTML('beforeend', '<div class="aviso bad">' + esc(errorTexto(e)) + '</div>'); return; }
  const efe = C.porPago.filter(x => norm(x.nombre) === 'efectivo').reduce((a, x) => a + x.monto, 0);
  const tickets = C.tickets.slice().reverse();
  let h = '<button class="volver" type="button" id="cerrar">← Volver</button><h1 class="ficha-nom">Corte de caja</h1>' +
    '<div class="dos" style="margin:10px 0 14px"><input type="date" id="coF" max="' + D.hoy + '" value="' + esc(fecha) + '"><div class="rapidos" style="align-items:center"><button type="button" id="coHoy">Hoy</button><button type="button" id="coAyer">Ayer</button></div></div>' +
    '<div class="kpis"><div class="kpi principal"><div class="t">Total vendido</div><div class="v">' + dinero(C.total) + '</div><div class="s">' + C.numTickets + ' tickets · promedio ' + dinero(C.ticketPromedio) + '</div></div>' +
    '<div class="kpi"><div class="t">Efectivo en caja</div><div class="v">' + dinero(efe) + '</div><div class="s">debe haber</div></div>' +
    '<div class="kpi"><div class="t">Servicios</div><div class="v">' + dinero(C.totalServicios) + '</div></div>' +
    '<div class="kpi"><div class="t">Productos</div><div class="v">' + dinero(C.totalProductos) + '</div><div class="s">ganancia ' + dinero(C.gananciaProductos) + '</div></div></div>';
  h += '<section class="seccion"><h2>Cómo pagaron</h2>' + (C.porPago.length ? C.porPago.map(x => '<div class="dato"><span>' + esc(x.nombre) + '</span><span>' + dinero(x.monto) + '</span></div>').join('') : '<div class="vacio">Sin ventas.</div>') +
    (C.descuentos ? '<div class="dato"><span>Descuentos dados</span><span style="color:var(--bad)">−' + dinero(C.descuentos) + '</span></div>' : '') + '</section>';
  if (C.porPersona.length) h += '<section class="seccion"><h2>Por quién atendió</h2>' + C.porPersona.map(x => '<div class="dato"><span>' + esc(x.nombre) + ' · ' + x.servicios + ' servicio' + (x.servicios === 1 ? '' : 's') + '</span><span>' + dinero(x.monto) + '</span></div>').join('') + '</section>';
  h += '<section class="seccion"><h2>Tickets<span class="n">' + tickets.length + '</span></h2>' + (tickets.length ? tickets.map(t =>
    '<div class="ticket"><div><b>' + esc(t.ticket) + '</b> · ' + esc(t.clienta) + '<div class="det" style="font-size:13px;color:var(--muted)">' + esc([t.pago, t.atendio].filter(Boolean).join(' · ')) + '</div></div><div class="num" style="font-weight:700">' + dinero(t.total) + '</div>' +
    '<div class="acc"><button class="btn btn-sec btn-mini" type="button" data-rec="' + esc(t.ticket) + '">Recibo</button><button class="btn btn-ghost btn-mini" type="button" data-can="' + esc(t.ticket) + '">Cancelar ticket</button></div></div>').join('') : '<div class="vacio">No hay tickets este día.</div>') + '</section>';
  $('panelIn').innerHTML = h;
  $('cerrar').onclick = () => { $('panel').hidden = true; };
  $('coF').onchange = e => e.target.value && abrirCorte(e.target.value);
  $('coHoy').onclick = () => abrirCorte(D.hoy);
  $('coAyer').onclick = () => abrirCorte(sumaDias(D.hoy, -1));
  $('panelIn').querySelectorAll('[data-rec]').forEach(b => b.onclick = async () => {
    const w = window.open('', '_blank'); // se abre ya para que el navegador no lo bloquee
    try { const r = await srv('obtenerRecibo', b.dataset.rec); if (!r.link) throw new Error('La clienta no tiene WhatsApp registrado.'); if (w) w.location = r.link; else location.href = r.link; }
    catch (e) { if (w) w.close(); toast(errorTexto(e), 4000); }
  });
  $('panelIn').querySelectorAll('[data-can]').forEach(b => b.onclick = async () => {
    const m = prompt('Cancelar ' + b.dataset.can + '. Se quita de las ventas y los productos regresan al inventario.\n\n¿Motivo?', '');
    if (m === null) return;
    if (m.trim().length < 3) { toast('Escribe el motivo para poder cancelar'); return; }
    b.disabled = true;
    try { const r = await srv('cancelarTicket', b.dataset.can, m.trim()); toast(r.mensaje, 4000); abrirCorte(fecha); refrescarDatos(); }
    catch (e) { b.disabled = false; toast(errorTexto(e), 4000); }
  });
}

/* ---------- Clientas y ficha ---------- */
let filtro = '';
function vClientas() {
  $('vista').innerHTML = '<div style="display:flex;gap:8px;margin-top:6px"><input id="q" type="search" placeholder="Buscar por nombre, WhatsApp o ID" value="' + esc(filtro) + '" autocomplete="off"><button class="btn btn-prim" type="button" id="cnueva" style="flex:none">+ Nueva</button></div><div class="lista" id="lc" style="margin-top:12px"></div>';
  $('cnueva').onclick = () => abrirFormClienta(null, { nombre: /\d/.test(filtro) ? '' : filtro, whatsapp: filtro.replace(/\D/g, '') });
  const pintar = () => {
    const q = norm(filtro), qt = filtro.replace(/\D/g, '');
    const l = D.clientas.filter(c => !q || norm(c.nombre).includes(q) || norm(c.id).includes(q) || (qt.length >= 3 && c.whatsapp.includes(qt)))
      .sort((a, b) => (b.ultima || '').localeCompare(a.ultima || '')).slice(0, 80);
    $('lc').innerHTML = l.length ? l.map(c => '<button type="button" class="fila clic" data-id="' + esc(c.id) + '"><div class="avatar">' + esc(iniciales(c.nombre)) + '</div><div class="txt"><div class="nom">' + esc(c.nombre) + '</div><div class="det">' +
      esc([c.id, c.piel, c.ultima ? 'última visita ' + isoMx(c.ultima) : 'sin visitas'].filter(Boolean).join(' · ')) + '</div></div><span class="chip ' + (c.estado === 'Activa' ? 'ok' : c.estado === 'Inactiva' ? 'bad' : '') + '">' + esc(c.estado || '—') + '</span></button>').join('')
      : '<div class="vacio">No hay clientas que coincidan.</div>';
    $('lc').querySelectorAll('button[data-id]').forEach(b => b.onclick = () => abrirFicha(b.dataset.id));
  };
  $('q').oninput = e => { filtro = e.target.value; pintar(); };
  pintar();
}

async function abrirFicha(id) {
  $('panelIn').innerHTML = '<div class="carga"><span class="spin"></span>Cargando ficha…</div>'; $('panel').hidden = false;
  try {
    const F = await srv('obtenerFicha', id), c = F.clienta;
    const dato = (a, b) => '<div class="dato"><span>' + esc(a) + '</span><span>' + esc(b || '—') + '</span></div>';
    let h = '<button class="volver" type="button" id="cerrar">← Volver</button><h1 class="ficha-nom">' + esc(c.nombre) + '</h1><div class="chips" style="margin:8px 0 12px">' +
      '<span class="chip">' + esc(c.id) + '</span><span class="chip ' + (c.estado === 'Activa' ? 'ok' : c.estado === 'Inactiva' ? 'bad' : '') + '">' + esc(c.estado || '—') + '</span>' +
      (c.aviso === 'Sí' ? '<span class="chip ok">Aviso firmado</span>' : '<span class="chip bad">Sin aviso</span>') + (c.cumpleMes ? '<span class="chip warn">Cumple este mes</span>' : '') + '</div>';
    if (c.alergias && c.alergias !== 'Ninguna') h += '<div class="aviso bad" style="margin-bottom:10px"><b>Alergias:</b> ' + esc(c.alergias) + '</div>';
    h += '<div class="chips" style="gap:8px">' + (F.linkWhatsApp ? '<a class="btn btn-wa" href="' + esc(F.linkWhatsApp) + '" target="_blank" rel="noopener">WhatsApp</a>' : '') + '<button class="btn btn-prim" type="button" id="fAt">Cobrar</button><button class="btn btn-sec" type="button" id="fCi">Agendar cita</button><button class="btn btn-sec" type="button" id="fEd">Editar datos</button></div>';
    h += '<div class="kpis" style="margin-top:14px"><div class="kpi"><div class="t">Ha gastado</div><div class="v">' + dinero(c.total) + '</div></div><div class="kpi"><div class="t">Visitas</div><div class="v">' + F.totalVisitas + '</div></div></div>';
    if (F.proximaCita || F.leToca || F.sugeridos.length || F.recompras.length) {
      h += '<section class="seccion"><h2>Siguiente paso</h2><div class="lista">';
      if (F.proximaCita) h += '<div class="aviso ok">Cita sugerida el <b>' + esc(F.proximaCita) + '</b></div>';
      if (F.leToca) h += '<div class="aviso warn">Le toca su <b>' + esc(F.leToca.servicio) + '</b>: van ' + F.leToca.dias + ' días (se recomienda cada ' + F.leToca.frecuencia + ')</div>';
      F.recompras.forEach(r => h += '<div class="aviso warn">' + esc(r.producto) + ': recompra ' + esc(r.recompra) + '</div>');
      if (F.sugeridos.length) h += '<div style="font-size:13px;color:var(--muted)">Ideal para su piel y aún no lo prueba:</div><div class="chips">' + F.sugeridos.map(s => '<span class="chip warn">' + esc(s.servicio) + (s.precio ? ' · ' + dinero(s.precio) : '') + '</span>').join('') + '</div>';
      h += '</div></section>';
    }
    h += seccionFidelidad(F, c);
    h += '<section class="seccion"><h2>Perfil</h2>' + dato('WhatsApp', c.whatsapp) + dato('Cumpleaños', c.nacimiento ? isoMx(c.nacimiento).slice(0, 5) + (F.edad !== '' ? ' · ' + F.edad + ' años' : '') : '') +
      dato('Tipo de piel', c.piel) + dato('Preocupación', c.preocupacion) + dato('Servicio favorito', F.favorito) + dato('Ticket promedio', dinero(F.ticketPromedio)) + dato('Clienta desde', isoMx(c.registro)) +
      (c.notas ? '<div class="aviso warn" style="margin-top:10px">' + esc(c.notas) + '</div>' : '') + '</section>';
    h += '<section class="seccion"><h2>Servicios</h2>' + (F.visitas.length ? F.visitas.map(v => '<div class="mov"><div style="display:flex;justify-content:space-between;gap:8px"><b>' + esc(v.servicio) + '</b><span class="num">' + dinero(v.monto) + '</span></div><div class="f">' + esc(v.fechaMX) + ' · ' + esc(v.atendio || '') + (v.notas ? ' · ' + esc(v.notas) : '') + '</div></div>').join('') : '<div class="vacio">Aún no tiene servicios.</div>') + '</section>';
    h += '<section class="seccion"><h2>Productos</h2>' + (F.compras.length ? F.compras.map(v => '<div class="mov"><div style="display:flex;justify-content:space-between;gap:8px"><b>' + esc(v.producto) + ' ×' + v.cantidad + '</b><span class="num">' + dinero(v.total) + '</span></div><div class="f">' + esc(v.fechaMX) + (v.recompra ? ' · recompra ' + esc(v.recompra) : '') + '</div></div>').join('') : '<div class="vacio">Aún no compra productos.</div>') + '</section>';
    $('panelIn').innerHTML = h; $('panel').scrollTop = 0;
    $('cerrar').onclick = () => $('panel').hidden = true;
    $('fAt').onclick = () => { $('panel').hidden = true; nueva = nuevaAtencion(id); tab = 'registrar'; render(); };
    $('fEd').onclick = () => abrirFormClienta(c);
    if ($('fVp')) $('fVp').onclick = () => { $('panel').hidden = true; nueva = nuevaAtencion(id); nueva.paquetes = [{ nombre: D.paquetes.length === 1 ? D.paquetes[0].nombre : '' }]; tab = 'registrar'; render(); };
    $('panelIn').querySelectorAll('[data-fic]').forEach(b => b.onclick = () => abrirFicha(b.dataset.fic));
    $('fCi').onclick = () => abrirFormCita(null, { idClienta: c.id, servicio: F.leToca ? F.leToca.servicio : (F.favorito || '') });
  } catch (e) {
    $('panelIn').innerHTML = '<button class="volver" type="button" onclick="document.getElementById(\'panel\').hidden=true">← Volver</button><div class="aviso bad" style="margin-top:10px">' + esc(errorTexto(e)) + '</div>';
  }
}

function seccionFidelidad(F, c) {
  const Fi = F.fidelidad; if (!Fi) return '';
  let h = '<section class="seccion"><h2>Fidelidad</h2>';
  if (Fi.lealtad) {
    const L = Fi.lealtad, sellos = Array.from({ length: L.cada }, (_, i) => '<i class="' + (i < L.enCiclo ? 'l' : '') + (i === L.cada - 1 ? ' p' : '') + '">' + (i === L.cada - 1 ? '🎁' : i < L.enCiclo ? '✓' : i + 1) + '</i>').join('');
    h += '<div style="font-size:14px">' + Fi.visitas + ' visita' + (Fi.visitas === 1 ? '' : 's') + ' · ' + (L.siguienteEsPremio ? '<b style="color:var(--ok)">¡Su próxima visita lleva ' + L.pct + '%!</b>' : (L.faltan === 1 ? 'le falta 1 visita' : 'le faltan ' + L.faltan + ' visitas') + ' para su ' + L.pct + '%') + '</div><div class="sellos">' + sellos + '</div>';
  }
  if (Fi.paquetes.length) {
    h += '<div class="lista" style="margin-top:8px">' + Fi.paquetes.map(p => '<div class="fila" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px"><b>🎟️ ' + esc(p.paquete) + '</b><span class="chip ' + (p.estado === 'Activo' ? 'ok' : p.estado === 'Vencido' ? 'bad' : '') + '">' + esc(p.estado) + '</span></div>' +
      '<div class="det" style="font-size:13px;color:var(--muted)">' + p.usadas + ' de ' + p.sesiones + ' sesiones usadas' + (p.vence ? ' · vence ' + esc(p.vence) : '') + ' · comprado ' + esc(p.fecha) + '</div>' +
      '<div class="barra-p"><span style="width:' + Math.round(p.usadas / Math.max(p.sesiones, 1) * 100) + '%"></span></div></div>').join('') + '</div>';
  }
  if (Fi.referidaPor) h += '<div class="dato"><span>La recomendó</span><span><button class="linkbtn" type="button" data-fic="' + esc(Fi.referidaPor.id) + '">' + esc(Fi.referidaPor.nombre) + '</button></span></div>';
  if (Fi.referidas.length) h += '<div class="dato"><span>Ha recomendado a</span><span>' + Fi.referidas.map(x => '<button class="linkbtn" type="button" data-fic="' + esc(x.id) + '">' + esc(primer(x.nombre)) + '</button>' + (x.vino ? ' ✓' : ' <small style="color:var(--muted)">(no ha venido)</small>')).join(', ') + '</span></div>';
  if (Fi.premiosPendientes) h += '<div class="aviso ok" style="margin-top:8px">💝 Tiene ' + (Fi.premiosPendientes === 1 ? 'un premio' : Fi.premiosPendientes + ' premios') + ' de ' + Fi.referidoPct + '% por recomendar. Se aplica al cobrarle.</div>';
  const botones = [];
  if ((D.paquetes || []).length) botones.push('<button class="btn btn-sec btn-mini" type="button" id="fVp">Venderle un paquete</button>');
  if (Fi.referidoPct && c.whatsapp && c.aceptaPromos === 'Sí') {
    const txt = 'Hola ' + primer(c.nombre) + ' 💕 ¿Tienes una amiga a la que le encantaría ' + D.negocio + '? Si viene de tu parte, ella tiene ' + Fi.referidoPct + '% en su primera visita y tú ' + Fi.referidoPct + '% en tu siguiente servicio 🎁 Solo dile que nos diga tu nombre.';
    botones.push('<a class="btn btn-wa btn-mini" target="_blank" rel="noopener" href="' + esc(wa(c.whatsapp, txt)) + '">Invitarla a recomendar</a>');
  }
  if (botones.length) h += '<div class="chips" style="gap:8px;margin-top:10px">' + botones.join('') + '</div>';
  return h + '</section>';
}

/* ---------- Reportes (dueña) ---------- */
async function abrirReportes() {
  $('panelIn').innerHTML = '<button class="volver" type="button" id="cerrar">← Volver</button><h1 class="ficha-nom">Reportes</h1><div class="carga"><span class="spin"></span>Calculando…</div>';
  $('panel').hidden = false; $('panel').scrollTop = 0;
  $('cerrar').onclick = () => { $('panel').hidden = true; };
  let R;
  try { R = await srv('obtenerReportes'); }
  catch (e) { $('panelIn').insertAdjacentHTML('beforeend', '<div class="aviso bad">' + esc(errorTexto(e)) + '</div>'); return; }
  const M = R.meses, act = M[5], ant = M[4];
  const cambio = ant.ventas ? Math.round((act.ventas - ant.ventas) / ant.ventas * 100) : null;
  let h = '<button class="volver" type="button" id="cerrar">← Volver</button><h1 class="ficha-nom">Reportes</h1>' +
    '<div class="kpis" style="margin-top:12px"><div class="kpi principal"><div class="t">Ventas del mes</div><div class="v">' + dinero(act.ventas) + '</div><div class="s">' + (cambio === null ? act.tickets + ' tickets' : (cambio >= 0 ? '▲ ' : '▼ ') + Math.abs(cambio) + '% vs ' + esc(ant.nombre)) + '</div></div>' +
    '<div class="kpi"><div class="t">Clientas nuevas</div><div class="v">' + act.nuevas + '</div><div class="s">este mes</div></div>' +
    '<div class="kpi"><div class="t">Regresan</div><div class="v">' + (R.retencion.pct === null ? '—' : R.retencion.pct + '%') + '</div><div class="s">' + (R.retencion.base ? R.retencion.volvieron + ' de ' + R.retencion.base + ' volvieron' : 'faltan datos') + '</div></div>' +
    '<div class="kpi"><div class="t">Ticket promedio</div><div class="v">' + dinero(act.promedio) + '</div><div class="s">' + act.visitas + ' visitas</div></div></div>';
  h += '<section class="seccion"><h2>Ventas por mes</h2><div id="gV"></div></section>';
  h += '<section class="seccion"><h2>Clientas nuevas por mes</h2><div id="gN"></div></section>';
  const rank = (l, val, sub) => { const mx = Math.max(1, ...l.map(val)); return '<div class="rank">' + l.map(x => '<div class="r"><span>' + esc(x.nombre) + '</span><b class="num">' + dinero(x.monto) + '</b><small>' + sub(x) + '</small><span></span><div class="bar"><span style="width:' + Math.max(2, Math.round(val(x) / mx * 100)) + '%"></span></div></div>').join('') + '</div>'; };
  h += '<section class="seccion"><h2>Servicios que más venden <small style="font-size:12px;color:var(--muted)">90 días</small></h2>' + (R.topServicios.length ? rank(R.topServicios, x => x.monto, x => x.veces + ' vez' + (x.veces === 1 ? '' : 'es')) : '<div class="vacio">Sin datos.</div>') + '</section>';
  h += '<section class="seccion"><h2>Productos que más venden <small style="font-size:12px;color:var(--muted)">90 días</small></h2>' + (R.topProductos.length ? rank(R.topProductos, x => x.monto, x => x.piezas + ' pza' + (x.piezas === 1 ? '' : 's')) : '<div class="vacio">Sin ventas de productos.</div>') + '</section>';
  h += '<section class="seccion"><h2>Mejores clientas <small style="font-size:12px;color:var(--muted)">12 meses</small></h2>' + (R.mejores.length ? '<div class="lista">' + R.mejores.map((c, i) => '<button type="button" class="fila clic" data-fic="' + esc(c.id) + '"><div class="avatar">' + (i + 1) + '</div><div class="txt"><div class="nom">' + esc(c.nombre) + '</div><div class="det">' + c.visitas + ' visitas' + (c.ultima ? ' · última ' + esc(c.ultima) : '') + '</div></div><b class="num">' + dinero(c.monto) + '</b></button>').join('') + '</div>' : '<div class="vacio">Sin datos.</div>') + '</section>';
  if (R.porEmpleada.length) h += '<section class="seccion"><h2>Por quién atendió <small style="font-size:12px;color:var(--muted)">este mes</small></h2>' + rank(R.porEmpleada, x => x.monto, x => x.servicios + ' servicio' + (x.servicios === 1 ? '' : 's')) + '</section>';
  h += '<section class="seccion"><h2>Paquetes y recomendaciones</h2>' +
    '<div class="dato"><span>Paquetes activos</span><span>' + R.paquetes.activos + '</span></div>' +
    '<div class="dato"><span>Vendidos este mes</span><span>' + R.paquetes.vendidosMes + '</span></div>' +
    '<div class="dato"><span>Sesiones ya pagadas por dar</span><span>' + R.paquetes.sesionesPorDar + ' (' + dinero(R.paquetes.dineroPorDar) + ')</span></div>' +
    '<div class="dato"><span>Clientas que llegaron recomendadas</span><span>' + R.referidas + '</span></div>' +
    '<p class="ejemplo" style="margin-top:8px">"Regresan" = de las clientas que vinieron por primera vez hace 2 a 12 meses, cuántas volvieron al menos una vez' + (R.retencion.pct60 !== null ? ' (' + R.retencion.pct60 + '% dentro de los primeros 60 días)' : '') + '.</p></section>';
  $('panelIn').innerHTML = h;
  $('cerrar').onclick = () => { $('panel').hidden = true; };
  $('panelIn').querySelectorAll('[data-fic]').forEach(b => b.onclick = () => abrirFicha(b.dataset.fic));
  grafica($('gV'), M, m => m.ventas, m => dinero(m.ventas), m => m.tickets + ' tickets · servicios ' + dinero(m.servicios) + ' · productos ' + dinero(m.productos) + (m.paquetes ? ' · paquetes ' + dinero(m.paquetes) : ''));
  grafica($('gN'), M, m => m.nuevas, m => m.nuevas + ' nueva' + (m.nuevas === 1 ? '' : 's'), m => m.visitas + ' visitas en el mes');
}
/** Barras de 6 meses: un solo color, toca una barra para ver su valor (empieza en el mes actual). */
function grafica(cont, M, val, etiqueta, detalle) {
  const mx = Math.max(1, ...M.map(val));
  let sel = M.length - 1;
  const pinta = () => {
    cont.innerHTML = '<div class="graf-sel"><span>' + esc(M[sel].nombre) + '</span><b>' + esc(etiqueta(M[sel])) + '</b></div><div class="graf" role="group" aria-label="Por mes">' +
      M.map((m, i) => '<button type="button" data-g="' + i + '" aria-pressed="' + (i === sel) + '" aria-label="' + esc(m.nombre + ': ' + etiqueta(m)) + '"><span style="height:' + Math.max(1, Math.round(val(m) / mx * 100)) + '%"></span></button>').join('') +
      '</div><div class="graf-x">' + M.map(m => '<span>' + esc(m.nombre) + '</span>').join('') + '</div><div class="ejemplo" style="margin-top:6px">' + esc(detalle(M[sel])) + '</div>';
    cont.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { sel = +b.dataset.g; pinta(); });
  };
  pinta();
}

/* ---------- Nueva clienta / editar ---------- */
/** c = clienta a editar (de la ficha) o null para nueva. pre = {nombre, whatsapp}. alGuardar(r) opcional (ej. desde Registrar). */
function abrirFormClienta(c, pre, alGuardar) {
  const ed = !!c; c = c || {}; pre = pre || {};
  const L = D.listas || {};
  const opt = (l, v) => '<option value="">—</option>' + (l || []).map(x => '<option' + (x === v ? ' selected' : '') + '>' + esc(x) + '</option>').join('');
  const hoyISO = D.hoy;
  let refId = c.referidaPor || '';
  const refC = refId ? D.clientas.find(x => x.id === refId) : null;
  const refNom = refC ? refC.nombre : refId;
  $('panelIn').innerHTML = '<button class="volver" type="button" id="cerrar">← ' + (ed ? 'Volver a la ficha' : 'Volver') + '</button>' +
    '<h1 class="ficha-nom">' + (ed ? 'Editar clienta' : 'Nueva clienta') + '</h1>' + (ed ? '<div class="chips" style="margin:8px 0 0"><span class="chip">' + esc(c.id) + '</span></div>' : '') +
    '<div class="campos" style="margin-top:14px">' +
    '<div><label class="l" for="kn">Nombre completo *</label><input id="kn" maxlength="80" autocomplete="off" autocapitalize="words" value="' + esc(c.nombre || pre.nombre || '') + '"></div>' +
    '<div class="dos"><div><label class="l" for="kw">WhatsApp *</label><input id="kw" type="tel" inputmode="numeric" placeholder="10 dígitos" value="' + esc(c.whatsapp || (pre.whatsapp || '').slice(-10)) + '"></div>' +
    '<div><label class="l" for="kb">Cumpleaños</label><input id="kb" type="date" max="' + hoyISO + '" value="' + esc(c.nacimiento || '') + '"></div></div>' +
    '<div><label class="l" for="kc">¿Cómo nos conoció?</label><select id="kc">' + opt(L.comoLlego, c.comoLlego) + '</select></div>' +
    '<div><label class="l" for="kr">¿Quién la recomendó? <small style="font-weight:400">(opcional)</small></label><div class="buscar"><input id="kr" autocomplete="off" placeholder="Busca a la clienta que la recomendó" value="' + esc(refNom) + '"><div class="sug" id="krs" hidden></div></div>' +
    (D.programa && D.programa.referidoPct ? '<div class="ejemplo" style="margin-top:4px">Ella tendrá ' + D.programa.referidoPct + '% en su primera visita y quien la recomendó, ' + D.programa.referidoPct + '% en su siguiente servicio.</div>' : '') + '</div>' +
    '<div class="dos"><div><label class="l" for="kp">Tipo de piel</label><select id="kp">' + opt(L.piel, c.piel) + '</select></div>' +
    '<div><label class="l" for="kq">Qué quiere mejorar</label><select id="kq">' + opt(L.preocupacion, c.preocupacion) + '</select></div></div>' +
    '<div><label class="l" for="ka">Alergias o condiciones</label><input id="ka" maxlength="150" placeholder="Ninguna" value="' + esc(c.alergias && c.alergias !== 'Ninguna' ? c.alergias : '') + '"></div>' +
    '<div><label class="l" for="kt">Notas</label><textarea id="kt" maxlength="500" placeholder="Preferencias, horarios…">' + esc(c.notas || '') + '</textarea></div>' +
    '<label class="fila" style="cursor:pointer;align-items:flex-start"><input type="checkbox" id="kav" style="width:auto;margin-top:3px"' + (c.aviso === 'Sí' ? ' checked' : '') + '><div class="txt"><div class="nom" style="white-space:normal">Aceptó el aviso de privacidad</div><div class="det">Necesario para guardar su piel y alergias y para mandarle promociones.</div></div></label>' +
    '<label class="fila" style="cursor:pointer"><input type="checkbox" id="kpr" style="width:auto"' + (c.aceptaPromos === 'Sí' ? ' checked' : '') + '><div class="txt"><div class="nom" style="white-space:normal">Acepta promociones por WhatsApp</div></div></label>' +
    '<div id="kmsg"></div><button class="btn btn-prim" type="button" id="kg" style="padding:13px">' + (ed ? 'Guardar cambios' : 'Registrar clienta') + '</button></div>';
  $('panel').hidden = false; $('panel').scrollTop = 0;
  $('cerrar').onclick = () => { if (ed) abrirFicha(c.id); else $('panel').hidden = true; };
  $('kw').oninput = function () { let t = this.value.replace(/\D/g, ''); if (t.length === 12 && t.indexOf('52') === 0) t = t.slice(2); this.value = t.slice(0, 10); };
  $('kav').onchange = function () { if (!this.checked) $('kpr').checked = false; };
  $('kpr').onchange = function () { if (this.checked && !$('kav').checked) { $('kav').checked = true; toast('Se marcó también el aviso de privacidad'); } };
  if (!ed && !$('kn').value) setTimeout(() => $('kn').focus(), 50);
  $('kr').oninput = () => {
    const q = norm($('kr').value), box = $('krs'); refId = '';
    if (!q) { box.hidden = true; return; }
    const l = D.clientas.filter(x => x.id !== c.id && (norm(x.nombre).includes(q) || norm(x.id).includes(q) || x.whatsapp.includes($('kr').value.replace(/\D/g, '') || '¬'))).slice(0, 6);
    box.innerHTML = l.length ? l.map(x => '<button type="button" data-id="' + esc(x.id) + '"><b>' + esc(x.nombre) + '</b><br><small>' + esc(x.id + ' · ' + x.whatsapp) + '</small></button>').join('') : '<button type="button" disabled><small>No está registrada</small></button>';
    box.hidden = false;
    box.querySelectorAll('[data-id]').forEach(b => b.onclick = () => { refId = b.dataset.id; $('kr').value = D.clientas.find(x => x.id === refId).nombre; box.hidden = true; if ($('kc').value === '' && (L.comoLlego || []).indexOf('Recomendación') >= 0) $('kc').value = 'Recomendación'; });
  };
  const msg = (h, cl) => $('kmsg').innerHTML = h ? '<div class="aviso ' + (cl || 'bad') + '">' + h + '</div>' : '';
  const guardarK = async forzar => {
    const d = {
      id: c.id || '', nombre: $('kn').value.trim(), whatsapp: $('kw').value, nacimiento: $('kb').value, registro: c.registro || '',
      comoLlego: $('kc').value, piel: $('kp').value, preocupacion: $('kq').value, alergias: $('ka').value.trim(), notas: $('kt').value.trim(),
      aviso: $('kav').checked ? 'Sí' : 'No', aceptaPromos: $('kpr').checked ? 'Sí' : 'No', forzarDuplicado: !!forzar, origen: 'App · ' + (SES ? SES.nombre : ''),
      referidaPor: refId
    };
    if ($('kr').value.trim() && !refId) return msg('Elige de la lista a la clienta que la recomendó (o borra ese campo).');
    if (d.nombre.split(/\s+/).length < 2) return msg('Escribe nombre y apellido.');
    if (d.whatsapp.length !== 10) return msg('El WhatsApp debe tener 10 dígitos.');
    if (d.aviso !== 'Sí' && (d.piel || d.preocupacion || d.alergias) && !confirm('Vas a guardar datos de piel/alergias sin aviso de privacidad. ¿Continuar?')) return;
    const b = $('kg'); b.disabled = true; b.textContent = 'Guardando…'; msg('');
    try {
      const r = await srv('guardarClienta', d);
      if (r && r.duplicado) {
        b.disabled = false; b.textContent = ed ? 'Guardar cambios' : 'Registrar clienta';
        msg(esc(r.mensaje) + '<div class="chips" style="margin-top:8px;gap:8px"><button class="btn btn-sec btn-mini" type="button" id="kver">Ver a esa clienta</button><button class="btn btn-ghost btn-mini" type="button" id="kforzar">Es otra persona, guardar</button></div>', 'warn');
        $('kver').onclick = () => alGuardar ? alGuardar({ id: r.idExistente }) : abrirFicha(r.idExistente);
        $('kforzar').onclick = () => guardarK(true);
        return;
      }
      // Actualiza la lista local para no tener que recargar todo
      const loc = { id: r.id, nombre: r.nombre, whatsapp: d.whatsapp, piel: d.piel, alergias: d.alergias || 'Ninguna', referidaPor: refId };
      const i = D.clientas.findIndex(x => x.id === r.id);
      if (i >= 0) Object.assign(D.clientas[i], loc); else D.clientas.unshift(Object.assign({ estado: '', ultima: '' }, loc));
      pitido(true);
      if (alGuardar) { toast(r.mensaje, 3500); alGuardar(r); return; }
      if (ed) { toast('Cambios guardados'); abrirFicha(r.id); return; }
      $('panelIn').innerHTML = '<button class="volver" type="button" id="cerrar">← Volver</button><div style="text-align:center;padding-top:20px"><span class="chip ok">Registrada</span>' +
        '<h1 class="ficha-nom" style="margin-top:10px">' + esc(r.nombre) + '</h1><div style="color:var(--muted)">' + esc(r.id) + '</div>' +
        '<div class="campos" style="margin-top:18px">' + (r.bienvenida && d.aviso === 'Sí' ? '<a class="btn btn-wa" style="padding:12px" target="_blank" rel="noopener" href="' + esc(r.bienvenida) + '">Mandar bienvenida por WhatsApp</a>' : '') +
        '<button class="btn btn-prim" type="button" id="kat" style="padding:12px">Registrar su atención</button><button class="btn btn-sec" type="button" id="kfi">Ver su ficha</button><button class="btn btn-ghost" type="button" id="kot">Registrar otra clienta</button></div></div>';
      $('cerrar').onclick = () => { $('panel').hidden = true; if (tab === 'clientas') vClientas(); };
      $('kat').onclick = () => { $('panel').hidden = true; nueva = nuevaAtencion(r.id); tab = 'registrar'; render(); };
      $('kfi').onclick = () => abrirFicha(r.id);
      $('kot').onclick = () => abrirFormClienta(null);
    } catch (e) { b.disabled = false; b.textContent = ed ? 'Guardar cambios' : 'Registrar clienta'; msg(esc(errorTexto(e))); }
  };
  $('kg').onclick = () => guardarK(false);
}

/* ---------- Registrar atención ---------- */
let nueva = null, forzarExistencia = false;
function nuevaAtencion(idc) {
  return { idc: idc || '', fecha: D.hoy, atendio: '', servicios: [{ s: '', m: '' }], productos: [], proxima: '', notas: '', res: null,
    pagos: [{ f: '', m: '' }], desc: { on: false, tipo: 'pct', valor: '', motivo: '' }, pagaCon: '', idCita: '', horaCita: '',
    paquetes: [], op: '', info: null };
}
const clientaPorId = id => D.clientas.find(c => c.id === id);

function vRegistrar() {
  if (!nueva) nueva = nuevaAtencion();
  const n = nueva;
  if (n.res) return vHecho();
  const c = clientaPorId(n.idc);
  const opt = (l, v, vacio) => (vacio ? '<option value="">' + vacio + '</option>' : '') + l.map(x => { const val = typeof x === 'object' ? x.v : x, t = typeof x === 'object' ? x.t : x; return '<option value="' + esc(val) + '"' + (val === v ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('');
  let h = '<div class="campos" style="margin-top:6px">';
  if (n.idCita) h += '<div class="aviso ok">Cobro de la cita de las <b>' + esc(n.horaCita) + '</b> · <button class="linkbtn" type="button" id="sinCita">quitar</button></div>';
  h += '<div><label class="l">Clienta</label>' + (c
    ? '<div class="elegida"><div><b>' + esc(c.nombre) + '</b><div style="font-size:12.5px;color:var(--muted)">' + esc(c.id + ' · ' + c.whatsapp) + '</div>' + (c.alergias && c.alergias !== 'Ninguna' ? '<span class="chip bad">Alergias: ' + esc(c.alergias) + '</span>' : '') + '</div><button class="btn btn-ghost btn-mini" type="button" id="cambiar">Cambiar</button></div>'
    : '<div class="buscar"><input id="bc" placeholder="Busca a la clienta" autocomplete="off"><div class="sug" id="bcs" hidden></div></div>') + '</div>';
  if (c) h += bloqueBeneficios(n);
  h += '<div class="dos"><div><label class="l" for="ra">Atendió</label><select id="ra">' + opt(D.listas.atendio, n.atendio, '—') + '</select></div><div><label class="l" for="rf">Fecha</label><input type="date" id="rf" value="' + n.fecha + '" max="' + D.hoy + '"></div></div>';
  h += '<div><label class="l">Servicios</label><div class="campos" style="gap:8px">' + n.servicios.map((s, i) => {
    const pq = paqueteDisponible(n, s, i);
    return '<div class="linea">' + botonServicio('data-s="' + i + '"', s.s, 'Servicio…') +
      (s.paq ? '<div class="paqmonto">Paquete</div>' : '<input data-m="' + i + '" type="number" inputmode="numeric" min="0" placeholder="$" value="' + esc(s.m) + '">') +
      '<button class="quitar" type="button" data-qs="' + i + '" aria-label="Quitar servicio">×</button></div>' +
      (pq ? '<div class="usa-paq"><button type="button" data-up="' + i + '" class="' + (s.paq ? 'on' : '') + '">' + (s.paq ? '✓ De su paquete' : 'Usar su paquete') + '</button><span>' + esc(pq.paquete) + ' · quedan ' + (pq.restantes - (s.paq ? 1 : 0)) + ' de ' + pq.sesiones + '</span></div>' : '');
  }).join('') +
    '<button class="agregar" type="button" id="addS">+ Servicio</button></div></div>';
  if ((D.paquetes || []).length) {
    h += '<div><label class="l">Paquetes que compra</label><div class="campos" style="gap:8px">' + n.paquetes.map((k, i) =>
      '<div class="linea k"><select data-k="' + i + '">' + opt(D.paquetes.map(x => ({ v: x.nombre, t: x.nombre + ' (' + x.sesiones + ' ses.)' })), k.nombre, 'Paquete…') + '</select><div class="paqmonto">' + (k.nombre ? dinero(paqCat(k.nombre).precio) : '') + '</div><button class="quitar" type="button" data-qk="' + i + '" aria-label="Quitar paquete">×</button></div>').join('') +
      '<button class="agregar" type="button" id="addK">+ Vender paquete</button></div></div>';
  }
  h += '<div><label class="l">Productos</label><div class="campos" style="gap:8px">' + barraLector('rscan', 'Escanea el producto') + n.productos.map((p, i) =>
    '<div class="linea p"><select data-p="' + i + '">' + opt(D.productos.map(x => ({ v: x.id, t: x.nombre + (x.existencia !== '' && x.existencia != null ? ' (' + x.existencia + ')' : '') })), p.id, 'Producto…') + '</select><input data-c="' + i + '" type="number" inputmode="numeric" min="1" value="' + esc(p.c) + '"><input data-pr="' + i + '" type="number" inputmode="numeric" min="0" placeholder="$" value="' + esc(p.pr) + '"><button class="quitar" type="button" data-qp="' + i + '" aria-label="Quitar producto">×</button></div>').join('') +
    '<button class="agregar" type="button" id="addP">+ Producto</button></div></div>';
  h += '<div><label class="l" for="rx">Próxima cita sugerida</label><input type="date" id="rx" value="' + n.proxima + '"></div>';
  h += '<div><label class="l" for="rn">Notas</label><textarea id="rn" placeholder="Reacción de la piel, recomendaciones…">' + esc(n.notas) + '</textarea></div>';
  // ---- Cobro: descuento y pagos ----
  const T = cuentas();
  h += '<div><label class="l">Cobro</label><div class="cobro">';
  h += '<div class="renglon"><span>Subtotal</span><span class="num" id="cSub">' + dinero2(T.sub) + '</span></div>';
  if (esPrograma(n.desc)) {
    h += '<div class="renglon"><span>' + esc(n.desc.motivo) + ' ' + n.desc.pct + '% <small style="color:var(--muted)">(servicios)</small> <button class="linkbtn" type="button" id="dOff">quitar</button></span><span class="num" id="cDesc" style="color:var(--bad)">−' + dinero2(T.desc) + '</span></div>';
  } else if (!n.desc.on) h += '<button class="linkbtn" type="button" id="dOn">+ Aplicar descuento</button>';
  else {
    h += '<div class="desc"><select id="dTipo"><option value="pct"' + (n.desc.tipo === 'pct' ? ' selected' : '') + '>%</option><option value="monto"' + (n.desc.tipo === 'monto' ? ' selected' : '') + '>$</option></select>' +

/* ---------- Lector de código de barras ----------

const ICO_CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><path d="M7.5 8v8M10 8v8M12.5 8v8M15 8v8M17 8v8" stroke-width="1.4"/></svg>';

/** alLeer(codigo, deTeclado). continuo=true: la cámara sigue abierta para escanear varias piezas. */

/* ---------- Cámara en vivo ----------

  const yo = CAM;

  $('camCerrar').textContent = CAM.continuo ? 'Listo' : 'Cancelar';

  try { const cap = track.getCapabilities ? track.getCapabilities() : {}; if (cap.torch) $('camLuz').hidden = false; } catch (e) { }

  const det = await crearDetector();

  if (!det && !Z) { $('camMsg').textContent = 'No se pudo cargar el lector (¿sin internet?). Toca "Usar foto".'; return; }

          if (!yo.continuo) { cerrarCamara(); alLeer(code); return; }

          $('camUlt').hidden = false;

const FORMATOS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'code_93', 'itf', 'codabar', 'qr_code'];

/** Dibuja la foto reducida (máx. `max` px), con margen blanco (por si el código quedó pegado a la orilla)

const POCAS = 3;
let INV = { q: '', filtro: 'todos' };
const controla = p => p.existencia !== '' && p.existencia != null;
function vInventario() {
  const prods = D.productos, bajos = prods.filter(p => controla(p) && p.existencia <= POCAS).length, sinCod = prods.filter(p => !p.codigo).length;
  let h = '<div class="campos" style="margin-top:6px">' + barraLector('iscan', 'Escanea un producto') +
    '<input id="iq" type="search" placeholder="Buscar por nombre, marca o ID" autocomplete="off" value="' + esc(INV.q) + '"></div>' +
    '<div class="filtros">' + [['todos', 'Todos · ' + prods.length], ['bajos', 'Por agotarse · ' + bajos], ['sincodigo', 'Sin código · ' + sinCod]].map(f =>
      '<button type="button" data-f="' + f[0] + '" aria-pressed="' + (INV.filtro === f[0]) + '">' + esc(f[1]) + '</button>').join('') + '</div>' +
    '<div class="lista" id="il" style="margin-top:12px"></div>' +
    (esDuena() ? '<button class="agregar" type="button" id="inuevo" style="margin-top:12px">+ Producto nuevo</button>' : '') +
    '<p class="ejemplo" style="margin-top:12px">Con un lector Bluetooth: toca el campo de escanear y dispara. Sin lector: toca el botón de la cámara y toma la foto del código.</p>';
  $('vista').innerHTML = h;
  const pintar = () => {
    const q = norm(INV.q);
    const l = prods.filter(p => (!q || norm(p.nombre + ' ' + p.marca + ' ' + p.id + ' ' + (p.codigo || '')).includes(q)) &&
      (INV.filtro !== 'bajos' || (controla(p) && p.existencia <= POCAS)) && (INV.filtro !== 'sincodigo' || !p.codigo))
      .sort((a, b) => (controla(a) ? a.existencia : 1e9) - (controla(b) ? b.existencia : 1e9) || a.nombre.localeCompare(b.nombre));
    $('il').innerHTML = l.length ? l.map(p => '<button type="button" class="fila clic" data-id="' + esc(p.id) + '"><div class="txt"><div class="nom">' + esc(p.nombre) + '</div><div class="det">' +
      esc([p.marca, dinero(p.precio)].filter(Boolean).join(' · ')) + ' · <span class="codigo">' + esc(p.codigo || 'sin código') + '</span></div></div>' +
      (controla(p) ? '<div class="stock' + (p.existencia <= POCAS ? ' bajo' : '') + '"><div class="q">' + p.existencia + '</div><div class="u">piezas</div></div>' : '<span class="chip">Sin control</span>') + '</button>').join('')
      : '<div class="vacio">No hay productos que coincidan.</div>';
    $('il').querySelectorAll('button[data-id]').forEach(b => b.onclick = () => abrirProducto(b.dataset.id));
  };
  $('iq').oninput = e => { INV.q = e.target.value; pintar(); };
  $('vista').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { INV.filtro = b.dataset.f; vInventario(); });
  if ($('inuevo')) $('inuevo').onclick = () => abrirNuevoProducto('');
  activarLector('iscan', c => {
    const p = productoPorCodigo(c); pitido(!!p);
    if (p) abrirProducto(p.id, true); else abrirCodigoDesconocido(c);
  });
  pintar();
}

/** Ficha del producto: existencia y "Agregar piezas". Escanear el mismo producto suma 1. */
function abrirProducto(id, porEscaneo) {
  const p = D.productos.find(x => x.id === id); if (!p) return;
  let cant = porEscaneo ? 1 : 0;
  const pinta = () => {
    const dato = (a, b) => '<div class="dato"><span>' + esc(a) + '</span><span>' + b + '</span></div>';
    $('panelIn').innerHTML = '<button class="volver" type="button" id="cerrar">← Volver</button><h1 class="ficha-nom">' + esc(p.nombre) + '</h1>' +
      '<div class="chips" style="margin:8px 0 14px"><span class="chip">' + esc(p.id) + '</span>' + (p.codigo ? '<span class="chip codigo">' + esc(p.codigo) + '</span>' : '<span class="chip warn">Sin código de barras</span>') + (p.categoria ? '<span class="chip">' + esc(p.categoria) + '</span>' : '') + '</div>' +
      '<div class="kpis"><div class="kpi' + (controla(p) && p.existencia <= POCAS ? '' : ' principal') + '"><div class="t">Existencia</div><div class="v" style="' + (controla(p) && p.existencia <= POCAS ? 'color:var(--bad)' : '') + '">' + (controla(p) ? p.existencia : '—') + '</div><div class="s">' + (controla(p) ? 'piezas' : 'sin control de inventario') + '</div></div>' +
      '<div class="kpi"><div class="t">Vendidas</div><div class="v">' + (p.vendidos || 0) + '</div><div class="s">piezas en total</div></div></div>' +
      '<section class="seccion"><h2>Entrada de mercancía</h2><div class="campos">' + barraLector('pscan', 'Escanea cada pieza') +
      '<div class="contador"><button type="button" id="menos" aria-label="Una menos">−</button><input id="pcant" type="number" inputmode="numeric" value="' + (cant || '') + '" placeholder="0"><button type="button" id="mas" aria-label="Una más">+</button></div>' +
      '<input id="pnota" placeholder="Nota: proveedor, factura… (opcional)">' +
      '<button class="btn btn-prim" type="button" id="pent" style="padding:13px">Agregar piezas</button><div id="pmsg"></div>' +
      '<div class="ejemplo">Para restar (merma, producto dañado) pon un número negativo.</div></div></section>' +
      '<section class="seccion"><h2>Datos</h2>' + dato('Marca', esc(p.marca || '—')) + dato('Precio de venta', dinero(p.precio)) + (esDuena() ? dato('Costo', p.costo ? dinero(p.costo) : '—') +
      dato('Ganancia por pieza', p.costo ? dinero(p.precio - p.costo) : '—') : '') + dato('Le dura a la clienta', p.dias ? p.dias + ' días' : '—') + '</section>' +
      '<section class="seccion"><h2>Código de barras</h2><div class="campos">' + barraLector('pcod', p.codigo ? 'Escanea para cambiarlo' : 'Escanea para ligarlo') + '</div></section>';
    $('panel').hidden = false;
    $('cerrar').onclick = () => { $('panel').hidden = true; if (tab === 'inventario') vInventario(); };
    const leerCant = () => Number($('pcant').value) || 0;
    $('menos').onclick = () => { cant = leerCant() - 1; $('pcant').value = cant || ''; };
    $('mas').onclick = () => { cant = leerCant() + 1; $('pcant').value = cant; };
    activarLector('pscan', (c, deTeclado) => {
      const q = productoPorCodigo(c);
      if (!q) { pitido(false); toast('El código ' + c + ' no está registrado'); return; }
      pitido(true);
      if (q.id !== p.id) { cerrarCamara(); toast('Ese es ' + q.nombre + '. Cambiando de producto…'); abrirProducto(q.id, true); return; }
      cant = leerCant() + 1; $('pcant').value = cant; toast(p.nombre + ': ' + cant + ' pieza' + (cant === 1 ? '' : 's'));
      if (deTeclado) $('pscan').focus();
    }, true);
    activarLector('pcod', async c => {
      const otro = productoPorCodigo(c);
      if (otro && otro.id === p.id) { pitido(true); toast('Ese código ya es de este producto'); return; }
      if (otro && otro.codigo === c) { pitido(false); toast('Ese código ya es de ' + otro.nombre, 4000); return; }
      if (p.codigo && !confirm('¿Cambiar el código ' + p.codigo + ' por ' + c + '?')) return;
      try { const r = await srv('asignarCodigoProducto', p.id, c); p.codigo = r.codigo; pitido(true); toast('Código ligado'); pinta(); }
      catch (e) { pitido(false); toast(errorTexto(e), 4500); }
    });
    $('pent').onclick = async () => {
      const n = leerCant(), b = $('pent');
      if (!n) { $('pmsg').innerHTML = '<div class="aviso bad">Escribe o escanea cuántas piezas entran.</div>'; return; }
      b.disabled = true; b.textContent = 'Guardando…';
      try {
        const r = await srvCola(p.nombre + ' +' + n, nuevoOp(), 'registrarEntrada', [{ idProducto: p.id, cantidad: n, nota: $('pnota').value.trim() }]);
        if (r.encolado) { cant = 0; pinta(); $('pmsg').innerHTML = '<div class="aviso warn">Sin señal: la entrada de ' + n + ' piezas se guardó en el celular y se manda sola cuando regrese el internet.</div>'; return; }
        p.existencia = r.existencia; cant = 0; pinta();
        $('pmsg').innerHTML = '<div class="aviso ok">' + esc(r.mensaje) + '</div>';
      } catch (e) { b.disabled = false; b.textContent = 'Agregar piezas'; $('pmsg').innerHTML = '<div class="aviso bad">' + esc(errorTexto(e)) + '</div>'; }
    };
  };
  pinta(); $('panel').scrollTop = 0;
}

/** Escanearon un código que nadie tiene: darlo de alta o ligarlo a un producto existente. */
function abrirCodigoDesconocido(c) {
  const sinCod = D.productos.filter(p => !p.codigo);
  $('panelIn').innerHTML = '<button class="volver" type="button" id="cerrar">← Volver</button><h1 class="ficha-nom">Código nuevo</h1>' +
    '<div class="chips" style="margin:8px 0 14px"><span class="chip codigo">' + esc(c) + '</span></div>' +
    '<div class="aviso warn">Este código no está registrado. ¿Es un producto nuevo o uno que ya tienes en la lista?</div>' +
    '<div class="campos" style="margin-top:14px">' + (esDuena() ? '<button class="btn btn-prim" type="button" id="cnuevo" style="padding:13px">Registrar producto nuevo</button>' : '<div class="ejemplo">Para dar de alta un producto nuevo pídeselo a la dueña.</div>') +
    (sinCod.length ? '<label class="l" for="cligar" style="margin-top:8px">O ligarlo a un producto que aún no tiene código</label><select id="cligar"><option value="">Elige…</option>' + sinCod.map(p => '<option value="' + esc(p.id) + '">' + esc(p.nombre) + '</option>').join('') + '</select><button class="btn btn-sec" type="button" id="cok">Ligar código</button>' : '') +
    '<div id="cmsg"></div></div>';
  $('panel').hidden = false; $('panel').scrollTop = 0;
  $('cerrar').onclick = () => { $('panel').hidden = true; };
  if ($('cnuevo')) $('cnuevo').onclick = () => abrirNuevoProducto(c);
  if ($('cok')) $('cok').onclick = async () => {
    const id = $('cligar').value; if (!id) return toast('Elige el producto');
    try { const r = await srv('asignarCodigoProducto', id, c); const p = D.productos.find(x => x.id === id); p.codigo = r.codigo; pitido(true); abrirProducto(id, true); }
    catch (e) { $('cmsg').innerHTML = '<div class="aviso bad">' + esc(errorTexto(e)) + '</div>'; }
  };
}

function abrirNuevoProducto(codigo) {
  const opt = l => '<option value="">—</option>' + (l || []).map(x => '<option>' + esc(x) + '</option>').join('');
  $('panelIn').innerHTML = '<button class="volver" type="button" id="cerrar">← Volver</button><h1 class="ficha-nom">Producto nuevo</h1>' +
    '<div class="campos" style="margin-top:14px">' +
    '<div><label class="l" for="nc">Código de barras</label>' + barraLector('nc', 'Escanéalo o déjalo vacío') + '</div>' +
    '<div><label class="l" for="nn">Nombre *</label><input id="nn" maxlength="80" placeholder="Ej. Sérum Vitamina C 30 ml"></div>' +
    '<div class="dos"><div><label class="l" for="nm">Marca</label><input id="nm" maxlength="40"></div><div><label class="l" for="ncat">Categoría</label><select id="ncat">' + opt(D.listas.categoria) + '</select></div></div>' +
    '<div><label class="l" for="npiel">Ideal para piel</label><select id="npiel">' + opt((D.listas.piel || []).concat(['Todo tipo'])) + '</select></div>' +
    '<div class="dos"><div><label class="l" for="np">Precio de venta *</label><input id="np" type="number" inputmode="numeric" min="0"></div><div><label class="l" for="nco">Costo</label><input id="nco" type="number" inputmode="numeric" min="0"></div></div>' +
    '<div class="dos"><div><label class="l" for="nex">Piezas que tienes</label><input id="nex" type="number" inputmode="numeric" min="0" placeholder="Vacío = sin control"></div><div><label class="l" for="nd">Días que le dura</label><input id="nd" type="number" inputmode="numeric" min="1" placeholder="Para recompra"></div></div>' +
    '<button class="btn btn-prim" type="button" id="ng" style="padding:13px">Guardar producto</button><div id="nmsg"></div></div>';
  $('panel').hidden = false; $('panel').scrollTop = 0;
  $('nc').value = codigo || '';
  $('cerrar').onclick = () => { $('panel').hidden = true; };
  activarLector('nc', c => {
    const otro = productoPorCodigo(c);
    if (otro && otro.codigo === c) { pitido(false); toast('Ese código ya es de ' + otro.nombre, 4000); return; }
    pitido(true); $('nc').value = c; $('nn').focus();
  });
  $('ng').onclick = async () => {
    const d = { codigo: limpiarCodigo($('nc').value), nombre: $('nn').value.trim(), marca: $('nm').value.trim(), categoria: $('ncat').value, piel: $('npiel').value,
      precio: $('np').value, costo: $('nco').value, existenciaInicial: $('nex').value, dias: $('nd').value };
    const msg = t => $('nmsg').innerHTML = '<div class="aviso bad">' + esc(t) + '</div>';
    if (d.nombre.length < 2) return msg('Escribe el nombre del producto.');
    if (!(Number(d.precio) > 0)) return msg('Escribe el precio de venta.');
    if (d.costo !== '' && Number(d.costo) > Number(d.precio)) return msg('El costo es mayor que el precio de venta.');
    const b = $('ng'); b.disabled = true; b.textContent = 'Guardando…';
    try {
      const r = await srv('guardarProducto', d);
      D.productos.push({ id: r.id, codigo: r.codigo, nombre: d.nombre, marca: d.marca, categoria: d.categoria, precio: Number(d.precio), costo: Number(d.costo) || 0,
        dias: d.dias === '' ? '' : Number(d.dias), vendidos: 0, existencia: d.existenciaInicial === '' ? '' : Number(d.existenciaInicial) });
      pitido(true); toast(r.mensaje); abrirProducto(r.id);
    } catch (e) { b.disabled = false; b.textContent = 'Guardar producto'; msg(errorTexto(e)); }
  };
  if (codigo) $('nn').focus();
}

/* ---------- Arranque ---------- */
$('fecha').textContent = new Date().toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
$('btnRecargar').onclick = () => { cargar(); sincronizarCola(); };
$('red').onclick = () => abrirCola();
window.addEventListener('online', () => { EN_LINEA = true; pintarRed(); sincronizarCola(); });
window.addEventListener('offline', () => { EN_LINEA = false; pintarRed(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) sincronizarCola(); });
setInterval(() => { if (COLA.some(x => !x.error)) sincronizarCola(); }, 30000);
pintarRed();
// La app abre aunque no haya internet (guarda sus archivos en el celular)
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => { });
pintarQuien();
cargar();
// Deja listo el lector de fotos para celulares sin lector integrado (iPhone)
if (!('BarcodeDetector' in window)) setTimeout(() => cargarZXing().catch(() => { }), 2500);
</script>
