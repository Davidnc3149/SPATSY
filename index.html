<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPATSY</title>
<meta name="description" content="App de SPATSY: clientas, atenciones, promociones e inventario.">
<meta name="theme-color" content="#A84A6E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SPATSY">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una mano — encabezado del día, contenido por pestaña, barra inferior fija */
:root {
  --bg: #FBF6F7; --surface: #FFFFFF; --ink: #2B2128; --muted: #7D6E77; --line: #EEDDE4;
  --rosa: #A84A6E; --rosa-soft: #F6E4EB; --ciruela: #4E3A48; --on-accent: #FFFFFF;
  --ok: #1F7A4D; --ok-soft: #E3F3EA; --warn: #8A6A07; --warn-soft: #FBF1D3; --bad: #B0382A; --bad-soft: #F9E0DC;
  --wa: #1F8A4C;
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1A1418; --surface: #241C21; --ink: #F3E9EE; --muted: #B3A2AC; --line: #3A2E35;
  --rosa: #E58AAE; --rosa-soft: #3C2531; --ciruela: #E9D6E1; --on-accent: #22151C;
  --ok: #6FD39C; --ok-soft: #1D3328; --warn: #E9C766; --warn-soft: #362D14; --bad: #F08E80; --bad-soft: #3B201D; --wa: #5CCB8A;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1A1418; --surface: #241C21; --ink: #F3E9EE; --muted: #B3A2AC; --line: #3A2E35;
  --rosa: #E58AAE; --rosa-soft: #3C2531; --ciruela: #E9D6E1; --on-accent: #22151C;
  --ok: #6FD39C; --ok-soft: #1D3328; --warn: #E9C766; --warn-soft: #362D14; --bad: #F08E80; --bad-soft: #3B201D; --wa: #5CCB8A;
  color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px; max-width: 640px; margin: 0 auto; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--rosa); outline-offset: 2px; }

/* Encabezado */
.top { padding-block: 18px 10px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.marca { font-family: var(--f-display); font-size: 26px; color: var(--rosa); letter-spacing: .5px; }
.fecha { color: var(--muted); font-size: 13px; text-transform: capitalize; }
.refresh { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13px; color: var(--muted); }

/* Barra inferior */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(6, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
nav.tabs button { border: 0; background: none; padding: 6px 0; border-radius: 10px; display: grid; justify-items: center; gap: 2px; font-size: 10.5px; font-weight: 600; color: var(--muted); min-width: 0; letter-spacing: -.1px; }
nav.tabs button svg { width: 21px; height: 21px; }
nav.tabs button[aria-selected="true"] { color: var(--rosa); background: var(--rosa-soft); }

/* Bloques */
.seccion { margin-top: 20px; }
.seccion > h2 { font-family: var(--f-display); font-weight: 400; font-size: 19px; color: var(--ciruela); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.seccion > h2 .n { font-family: var(--f-body); font-size: 13px; font-weight: 700; color: var(--rosa); background: var(--rosa-soft); padding: 1px 9px; border-radius: 99px; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.kpi .t { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; font-weight: 600; }
.kpi .v { font-family: var(--f-display); font-size: 26px; color: var(--ink); font-variant-numeric: tabular-nums; margin-top: 2px; }
.kpi .s { font-size: 12px; color: var(--muted); }
.kpi.principal { background: var(--rosa); border-color: var(--rosa); }
.kpi.principal .t, .kpi.principal .s, .kpi.principal .v { color: var(--on-accent); }

.lista { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
.fila { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 11px 12px; display: flex; align-items: center; gap: 10px; }
.fila .txt { flex: 1; min-width: 0; }
.fila .nom { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fila .det { font-size: 13px; color: var(--muted); }
.fila.hecha { opacity: .55; }
.fila.clic { cursor: pointer; text-align: left; width: 100%; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--rosa-soft); color: var(--rosa); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
.vacio { color: var(--muted); font-size: 13.5px; padding: 6px 2px; }

.btn { border: 0; border-radius: 99px; padding: 9px 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; font-size: 14px; }
.btn-prim { background: var(--rosa); color: var(--on-accent); }
.btn-sec { background: var(--rosa-soft); color: var(--ciruela); }
.btn-wa { background: var(--wa); color: #FFFFFF; padding: 8px 13px; font-size: 13px; flex: none; }
.btn-mini { padding: 6px 11px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn-ghost { background: none; border: 1px solid var(--line); color: var(--muted); }

.chip { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--rosa-soft); color: var(--ciruela); }
.chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.warn { background: var(--warn-soft); color: var(--warn); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }

.aviso { border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
.aviso.bad { background: var(--bad-soft); color: var(--bad); } .aviso.ok { background: var(--ok-soft); color: var(--ok); } .aviso.warn { background: var(--warn-soft); color: var(--warn); }

/* Formularios */
label.l { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
input, select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
textarea { resize: vertical; min-height: 70px; }
.campos { display: grid; gap: 12px; }
.dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.linea { display: grid; grid-template-columns: 1fr 96px 36px; gap: 8px; align-items: center; }
.linea.p { grid-template-columns: 1fr 58px 84px 36px; }
.quitar { border: 0; background: var(--bad-soft); color: var(--bad); border-radius: 10px; height: 40px; font-weight: 700; }
.agregar { border: 1px dashed var(--rosa); background: none; color: var(--rosa); border-radius: 12px; padding: 9px; font-weight: 600; width: 100%; }
.total { display: flex; justify-content: space-between; align-items: baseline; background: var(--rosa-soft); border-radius: var(--r); padding: 12px 14px; }
.total .v { font-family: var(--f-display); font-size: 26px; color: var(--rosa); font-variant-numeric: tabular-nums; }
.pick { width: 100%; min-width: 0; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 30px 10px 12px; position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.pick::after { content: "⌄"; position: absolute; right: 11px; top: 50%; transform: translateY(-62%); color: var(--muted); }
.pick.vacio { color: var(--muted); }
.selsv { position: fixed; inset: 0; z-index: 60; background: rgba(30, 15, 25, .45); display: flex; align-items: flex-end; justify-content: center; }
.selsv-in { background: var(--bg); width: 100%; max-width: 560px; height: 86vh; height: 86dvh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; overflow: hidden; }
.selsv-top { padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.selsv-top div { display: flex; justify-content: space-between; align-items: center; }
.selsv-top input { font-size: 16px; padding: 12px 14px; }
.selsv-lista { overflow-y: auto; flex: 1; padding: 4px 8px 24px; -webkit-overflow-scrolling: touch; }
.selsv-lista button { display: flex; width: 100%; justify-content: space-between; gap: 12px; align-items: center; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; padding: 13px 8px; }
.selsv-lista button.on { color: var(--rosa); font-weight: 700; }
.selsv-lista button span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 14px; }
.selsv-lista .grupo { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 12px 8px 4px; }
.selsv-lista .nada { padding: 24px 8px; color: var(--muted); text-align: center; }
.cita-wa { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.cita-wa .btn-wa { padding: 10px 12px; }
.cita-wa .btn-wa.ya { background: var(--ok-soft); color: var(--ok); }
.buscar { position: relative; }
.sug { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: 0 10px 24px rgba(40, 20, 30, .12); }
.sug button { display: block; width: 100%; border: 0; background: none; text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.sug button small { color: var(--muted); }
.elegida { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--rosa-soft); border-radius: 12px; padding: 10px 12px; }

/* Panel de ficha */
.panel { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(30px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.panel-in { max-width: 640px; margin: 0 auto; }
.volver { border: 0; background: none; color: var(--rosa); font-weight: 600; padding: 4px 0; }
.ficha-nom { font-family: var(--f-display); font-size: 26px; margin-top: 8px; }
.dato { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.dato span:first-child { color: var(--muted); }
.dato span:last-child { font-weight: 600; text-align: right; }
.mov { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.mov .f { color: var(--muted); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.ia-out { white-space: pre-wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; font-size: 14px; }
.burbuja { background: var(--ok-soft); color: var(--ink); border-radius: 14px 14px 14px 4px; padding: 10px 12px; white-space: pre-wrap; font-size: 14px; }
.var { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; }
.var h3 { font-size: 14px; color: var(--ciruela); }
.carga { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 30px 0; justify-content: center; }
.spin { width: 18px; height: 18px; border: 3px solid var(--rosa-soft); border-top-color: var(--rosa); border-radius: 50%; animation: g .8s linear infinite; }
@keyframes g { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ciruela); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 70; max-width: 90%; }
.ejemplo { font-size: 12px; color: var(--muted); }

/* Lector de código de barras: campo para lector Bluetooth/teclado + botón de cámara (foto) */
.scan { display: flex; gap: 8px; align-items: stretch; }
.scan input { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .4px; border-style: dashed; border-color: var(--rosa); background: var(--rosa-soft); }
.scan .cam { flex: none; width: 50px; border: 0; border-radius: 12px; background: var(--rosa); color: var(--on-accent); display: grid; place-items: center; }
.scan .cam svg { width: 24px; height: 24px; }
.scan .cam:disabled { opacity: .6; }
.filtros { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.filtros button { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 99px; padding: 5px 12px; font-size: 13px; font-weight: 600; }
.filtros button[aria-pressed="true"] { background: var(--rosa); border-color: var(--rosa); color: var(--on-accent); }
.stock { flex: none; text-align: right; }
.stock .q { font-family: var(--f-display); font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
.stock .u { font-size: 11px; color: var(--muted); }
.stock.bajo .q { color: var(--bad); }
.codigo { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
.contador { display: grid; grid-template-columns: 52px 1fr 52px; gap: 8px; }
.contador button { border: 0; border-radius: 12px; background: var(--rosa-soft); color: var(--rosa); font-size: 22px; font-weight: 700; }
.contador input { text-align: center; font-family: var(--f-display); font-size: 24px; padding: 8px; }
.scan .cam { cursor: pointer; }
.scan .cam.ocupado { opacity: .6; pointer-events: none; }
/* Cámara en vivo */
.camara { position: fixed; inset: 0; z-index: 60; background: #000; color: #fff; }
.camara[hidden] { display: none; }
.camara video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.camara .marco { position: absolute; left: 7%; right: 7%; top: 34%; height: 24%; border: 3px solid rgba(255,255,255,.9); border-radius: 18px; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); }
.camara .marco.ok { border-color: #6FD39C; }
.camara .laser { position: absolute; left: 6%; right: 6%; top: 50%; height: 2px; background: #E58AAE; box-shadow: 0 0 10px #E58AAE; animation: laser 1.6s ease-in-out infinite alternate; }
@keyframes laser { from { top: 12%; } to { top: 88%; } }
@media (prefers-reduced-motion: reduce) { .camara .laser { animation: none; } }
.camara .cam-top { position: absolute; left: 0; right: 0; top: 0; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 12px; text-align: center; font-size: 16px; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
.camara .cam-ult { position: absolute; left: 50%; transform: translateX(-50%); top: calc(60% + 14px); background: rgba(31,122,77,.92); color: #fff; padding: 8px 14px; border-radius: 12px; font-size: 14px; max-width: 86%; text-align: center; }
.camara .cam-ult[hidden] { display: none; }
.camara .cam-bot { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.camara .cam-bot .btn { min-width: 110px; padding: 12px 16px; }
.camara .cam-bot .btn-ghost { color: #fff; border-color: rgba(255,255,255,.5); background: rgba(0,0,0,.25); }
/* Agenda */
.semana { display: grid; grid-template-columns: 34px repeat(7, 1fr) 34px; gap: 4px; align-items: stretch; margin-top: 6px; }
.semana .flecha { border: 0; background: none; color: var(--rosa); font-size: 22px; font-weight: 700; padding: 0; }
.dia { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 6px 0 5px; display: grid; justify-items: center; gap: 1px; min-width: 0; }
.dia .dn { font-size: 10.5px; color: var(--muted); text-transform: uppercase; font-weight: 600; }
.dia .dd { font-family: var(--f-display); font-size: 18px; line-height: 1.1; }
.dia .dc { font-size: 10.5px; font-weight: 700; color: var(--rosa); min-height: 14px; }
.dia.hoy { border-color: var(--rosa); }
.dia[aria-pressed="true"] { background: var(--rosa); border-color: var(--rosa); color: var(--on-accent); }
.dia[aria-pressed="true"] .dn, .dia[aria-pressed="true"] .dc { color: var(--on-accent); }
.cita { display: grid; grid-template-columns: 62px 1fr auto; gap: 10px; align-items: center; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--rosa); border-radius: var(--r); padding: 10px 12px; }
.cita .h { font-family: var(--f-display); font-size: 17px; line-height: 1.1; }
.cita .h small { display: block; font-family: var(--f-body); font-size: 11.5px; color: var(--muted); }
.cita.e-Confirmada { border-left-color: var(--ok); } .cita.e-Pendiente { border-left-color: var(--warn); }
.cita.e-Atendida, .cita.e-Cancelada, .cita.e-No { opacity: .6; } .cita.e-Cancelada .nom { text-decoration: line-through; }
.chip.e-Pendiente { background: var(--warn-soft); color: var(--warn); } .chip.e-Confirmada { background: var(--ok-soft); color: var(--ok); }
.chip.e-No { background: var(--bad-soft); color: var(--bad); } .chip.e-Cancelada { background: var(--line); color: var(--muted); }
.acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.acciones .btn { padding: 11px 10px; }
.acciones .ancho { grid-column: 1 / -1; }
/* Cobro */
.cobro { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
.cobro .renglon { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 14.5px; }
.cobro .renglon.gran { font-size: 16px; font-weight: 700; }
.cobro .renglon.gran .num { font-family: var(--f-display); font-size: 26px; color: var(--rosa); font-weight: 400; }
.pago { display: grid; grid-template-columns: 1fr 110px 36px; gap: 8px; align-items: center; }
.pago input[readonly] { background: var(--bg); color: var(--muted); }
.desc { display: grid; grid-template-columns: 74px 1fr; gap: 8px; }
.rapidos { display: flex; gap: 6px; flex-wrap: wrap; }
.rapidos button { border: 1px solid var(--line); background: var(--surface); color: var(--ciruela); border-radius: 99px; padding: 5px 11px; font-size: 12.5px; font-weight: 600; }
.cambio { background: var(--ok-soft); color: var(--ok); border-radius: 10px; padding: 8px 12px; font-weight: 700; display: flex; justify-content: space-between; }
.linkbtn { border: 0; background: none; color: var(--rosa); font-weight: 600; padding: 2px 0; text-align: left; }
/* Corte */
.ticket { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ticket .acc { grid-column: 1 / -1; display: flex; gap: 8px; }
.ticket.cancelado { opacity: .5; }
/* Red / sin señal */
.top-der { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.red { border: 0; border-radius: 99px; padding: 4px 10px; font-size: 12px; font-weight: 700; background: var(--warn-soft); color: var(--warn); }
.red.off { background: var(--warn-soft); color: var(--warn); }
.red.mal { background: var(--bad-soft); color: var(--bad); }
/* Beneficios de la clienta al cobrar */
.benef { display: grid; gap: 6px; }
.benef .b { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; font-size: 13.5px; }
.benef .b.ok { border-color: var(--ok); background: var(--ok-soft); }
.benef .b .t { min-width: 0; }
.usa-paq { margin: -2px 0 2px; display: flex; gap: 8px; align-items: center; font-size: 13px; }
.usa-paq button { white-space: nowrap; flex: none; border: 1px solid var(--rosa); background: none; color: var(--rosa); border-radius: 99px; padding: 4px 10px; font-weight: 600; font-size: 12.5px; }
.usa-paq button.on { background: var(--rosa); color: var(--on-accent); }
.linea.k { grid-template-columns: 1fr 96px 36px; }
.linea .paqmonto { text-align: right; font-weight: 700; color: var(--rosa); font-variant-numeric: tabular-nums; padding-right: 6px; }
/* Sellos de lealtad */

.graf button[aria-pressed="true"] span { opacity: 1; }
.graf-x { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; font-size: 11.5px; color: var(--muted); text-align: center; margin-top: 4px; }
.graf-sel { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); }
.graf-sel b { font-family: var(--f-display); font-weight: 400; font-size: 22px; color: var(--ink); }
.rank { display: grid; gap: 8px; }
.rank .r { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 14px; }
.rank .r .bar { grid-column: 1 / -1; height: 6px; background: var(--rosa-soft); border-radius: 99px; overflow: hidden; }
.rank .r .bar span { display: block; height: 100%; background: var(--rosa); border-radius: 99px; }
.rank .r small { color: var(--muted); }
.kpi.clic { cursor: pointer; }
.foto-oculta { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; left: -10px; top: 0; }
.quien { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.quien button { border: 0; background: none; color: var(--rosa); font-weight: 600; padding: 0 0 0 4px; font-size: 12.5px; }

/* Entrada con PIN */
.login { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }

.login .marca { font-size: 40px; }
.login p { margin: 0; color: var(--muted); font-size: 14px; }
.login input { text-align: center; font-size: 28px; letter-spacing: 10px; padding: 12px; font-family: var(--f-display); }
.login .btn { padding: 13px; font-size: 16px; }
</style>

<script>
/* ============================================================
   SPATSY · App móvil (página independiente, p. ej. GitHub Pages)
   Habla con la hoja por fetch → doPost del proyecto "SPATSY App".
   Todo pasa por api(token, acción, args) del servidor. Acciones: appInicio, obtenerFicha,
   registrarAtencion, registrarRecordatorioEnviado, obtenerSegmento,
   prepararCampana, marcarEnviado, registrarEntrada, guardarProducto,
   asignarCodigoProducto.
   ============================================================ */
let D = null, tab = 'hoy';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dinero = n => '$' + Math.round(Number(n) || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const primer = s => String(s || '').trim().split(/\s+/)[0] || '';
const iniciales = s => String(s || '').trim().split(/\s+/).slice(0, 2).map(x => x[0] || '').join('').toUpperCase();
const isoMx = s => s ? s.split('-').reverse().join('/') : '';
/* ---- Selector de servicio con buscador (son muchos para un menú normal) ---- */
const botonServicio = (attrs, valor, vacio) => '<button type="button" class="pick' + (valor ? '' : ' vacio') + '" ' + attrs + ' value="' + esc(valor || '') + '">' + esc(valor || vacio || 'Servicio…') + '</button>';
function elegirServicio(actual, alElegir, conVacio) {
  const lista = (D.listas && D.listas.servicio) || [];
  const precio = s => { const x = D.servicios && D.servicios[s]; return x && x.precio ? dinero(x.precio) : ''; };
  const ov = document.createElement('div');
  ov.className = 'selsv';
  ov.innerHTML = '<div class="selsv-in" role="dialog" aria-label="Elegir servicio"><div class="selsv-top"><div><b>Elegir servicio</b><button type="button" class="btn btn-ghost btn-mini" data-x>Cerrar</button></div>' +
    '<input type="search" placeholder="Escribe: dermapen, pestañas, láser…" autocomplete="off" enterkeyhint="done"></div><div class="selsv-lista"></div></div>';
  document.body.appendChild(ov);
  const inp = ov.querySelector('input'), box = ov.querySelector('.selsv-lista');
  let visibles = [];
  const cerrar = () => { ov.remove(); document.removeEventListener('keydown', tecla); };
  const elegir = v => { cerrar(); alElegir(v); };
  const pintar = () => {
    const pal = norm(inp.value).split(/\s+/).filter(Boolean);
    visibles = pal.length ? lista.filter(s => { const t = norm(s); return pal.every(p => t.indexOf(p) >= 0); }) : lista.slice();
    let h = '';
    if (conVacio && !pal.length) h += '<button type="button" data-v=""><span>— Sin servicio —</span><span></span></button>';
    if (!pal.length && actual && lista.indexOf(actual) >= 0) h += '<div class="grupo">Elegido</div><button type="button" class="on" data-v="' + esc(actual) + '"><span>' + esc(actual) + '</span><span>' + precio(actual) + '</span></button><div class="grupo">Todos (' + lista.length + ')</div>';
    h += visibles.map(s => '<button type="button"' + (s === actual ? ' class="on"' : '') + ' data-v="' + esc(s) + '"><span>' + esc(s) + '</span><span>' + precio(s) + '</span></button>').join('');
    if (!visibles.length) h += '<div class="nada">No hay ningún servicio con “' + esc(inp.value) + '”.<br>Revisa cómo está escrito en la hoja LISTAS.</div>';
    box.innerHTML = h;
    box.scrollTop = 0;
  };
  const tecla = e => { if (e.key === 'Escape') cerrar(); };
  document.addEventListener('keydown', tecla);
  inp.oninput = pintar;
  inp.onkeydown = e => { if (e.key === 'Enter' && visibles.length === 1) { e.preventDefault(); elegir(visibles[0]); } };
  box.onclick = e => { const b = e.target.closest('[data-v]'); if (b) elegir(b.dataset.v); };
  ov.onclick = e => { if (e.target === ov || e.target.closest('[data-x]')) cerrar(); };
  pintar();
  setTimeout(() => inp.focus(), 60);
}
function toast(m, ms) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => t.hidden = true, ms || 2800); }
/* ---------- Sesión con PIN ---------- */
const LLAVE = 'spatsy_sesion';
let SES = (() => { try { return JSON.parse(localStorage.getItem(LLAVE) || 'null'); } catch (e) { return null; } })();
function guardarSesion(s) { SES = s; try { if (s) localStorage.setItem(LLAVE, JSON.stringify(s)); else localStorage.removeItem(LLAVE); } catch (e) { } }
/* La hoja de SPATSY responde en esta dirección (proyecto "SPATSY App", doPost). */
const API_URL = 'https://script.google.com/macros/s/AKfycbxTJeybqS0iDV_DsJud9K7xnoy0PDyA3RhSlJ3tqK9VmqD57XZumcVGyYy8rkNOV429/exec';
const errorRed = () => { const e = new Error('Sin conexión a internet. Revisa tu señal y vuelve a intentar.'); e.red = true; return e; };
let EN_LINEA = true;
async function llamarApi(cuerpo) {
  let r;
  const ctl = window.AbortController ? new AbortController() : null;
  const tm = setTimeout(() => ctl && ctl.abort(), 45000);
  try {
    // text/plain: Google lo acepta sin "preflight" de CORS
    r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(cuerpo), redirect: 'follow', credentials: 'omit', signal: ctl ? ctl.signal : undefined });
  } catch (e) { clearTimeout(tm); EN_LINEA = false; pintarRed(); throw errorRed(); }
  clearTimeout(tm);
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('La hoja no respondió bien (código ' + r.status + '). Intenta de nuevo en un momento.'); }
  if (!EN_LINEA) { EN_LINEA = true; pintarRed(); setTimeout(sincronizarCola, 500); }
  if (!j || !j.ok) throw new Error((j && j.error) || 'Error desconocido');
  return j.data;
}
function run(fn, args) {
  if (fn === 'entrar') return llamarApi({ accion: 'entrar', pin: args[0] });
  if (fn === 'salir') return llamarApi({ accion: 'salir', token: args[0] });
  return llamarApi({ accion: 'api', token: args[0], fn: args[1], args: args[2], op: args[3] });
}
/* Acciones que escriben: llevan un "op" para que un reintento nunca duplique (el servidor lo recuerda). */
const ESCRIBEN = { guardarClienta: 1, registrarAtencion: 1, registrarRecordatorioEnviado: 1, prepararCampana: 1, marcarEnviado: 1, registrarEntrada: 1, asignarCodigoProducto: 1, guardarCita: 1, cambiarEstadoCita: 1, marcarRecordatorioCita: 1, guardarProducto: 1, cancelarTicket: 1 };
function nuevoOp() {
  const r = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
  return (Date.now().toString(36) + '-' + r).replace(/[^\w-]/g, '').slice(0, 60);
}
const espera = ms => new Promise(ok => setTimeout(ok, ms));
async function srvOp(op, fn, args) {
  if (!SES) { pedirPin(); throw new Error('Entra con tu PIN.'); }
  let intento = 0;
  for (;;) {
    try { return await run('api', [SES.token, fn, args, op]); }
    catch (e) {
      if (/SESION:/.test(e.message)) { guardarSesion(null); pedirPin(errorTexto(e)); throw e; }
      // Wifi que va y viene: reintenta con el mismo op (no duplica)
      if (e.red && op && intento < 2) { intento++; await espera(intento * 2000); continue; }
      throw e;
    }
  }
}
function srv(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return srvOp(ESCRIBEN[fn] ? nuevoOp() : '', fn, args);
}
/** Escritura que, si no hay señal, se guarda en el celular y se manda sola después. */
async function srvCola(desc, op, fn, args, argsCola) {
  try { return await srvOp(op, fn, args); }
  catch (e) {
    if (!e.red) throw e;
    COLA.push({ op: op, fn: fn, args: argsCola || args, desc: desc, t: Date.now() });
    guardarCola();
    return { encolado: true };
  }
}

/* ---------- Cola sin señal ---------- */
const COLA_K = 'spatsy_cola', DATOS_K = 'spatsy_datos';
let COLA = (() => { try { return JSON.parse(localStorage.getItem(COLA_K) || '[]') || []; } catch (e) { return []; } })();
function guardarCola() { try { localStorage.setItem(COLA_K, JSON.stringify(COLA)); } catch (e) { } pintarRed(); }
let SINC = false;
async function sincronizarCola() {
  if (SINC || !SES || !COLA.some(x => !x.error)) return;
  SINC = true; pintarRed();
  let enviados = 0;
  try {
    for (const it of COLA.slice()) {
      if (it.error) continue;
      try {
        const r = await srvOp(it.op, it.fn, it.args);
        COLA = COLA.filter(x => x.op !== it.op); guardarCola(); enviados++;
        if (it.fn === 'registrarAtencion') toast('Se envió el cobro de ' + it.desc + (r && r.ticket ? ' · ' + r.ticket : ''), 4000);
      } catch (e) {
        if (e.red || /SESION:/.test(e.message)) break;
        it.error = errorTexto(e); guardarCola();
      }
    }
  } finally { SINC = false; pintarRed(); }
  if (enviados) refrescarDatos();
}
function pintarRed() {
  const b = $('red'); if (!b) return;
  const pend = COLA.filter(x => !x.error).length, mal = COLA.filter(x => x.error).length;
  const off = !EN_LINEA || (navigator.onLine === false);
  if (!off && !pend && !mal) { b.hidden = true; return; }
  b.hidden = false;
  b.className = 'red' + (mal ? ' mal' : off ? ' off' : '');
  b.textContent = mal ? '⚠ ' + mal + ' sin enviar' : SINC ? 'Enviando…' : off ? (pend ? 'Sin señal · ' + pend + ' por enviar' : 'Sin señal') : pend + ' por enviar';
}
function abrirCola() {
  const fmt = t => new Date(t).toLocaleString('es-MX', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
  const nom = { registrarAtencion: 'Cobro', registrarEntrada: 'Entrada de mercancía', cambiarEstadoCita: 'Cambio de cita', marcarRecordatorioCita: 'Confirmación de cita', registrarRecordatorioEnviado: 'Mensaje enviado', marcarEnviado: 'Promoción enviada' };
  $('panelIn').innerHTML = '<button class="volver" type="button" id="cerrar">← Volver</button><h1 class="ficha-nom">Por enviar</h1>' +
    '<p class="ejemplo" style="margin:6px 0 12px">Lo que se guardó sin señal. Se manda solo cuando regresa el internet; no se duplica aunque se intente varias veces.</p>' +
    (COLA.length ? '<div class="lista">' + COLA.map((x, i) => '<div class="fila" style="align-items:flex-start"><div class="txt"><div class="nom">' + esc((nom[x.fn] || x.fn) + (x.desc ? ' · ' + x.desc : '')) + '</div><div class="det">' + esc(fmt(x.t)) + '</div>' +
      (x.error ? '<div class="aviso bad" style="margin-top:6px">' + esc(x.error) + '</div>' : '') + '</div>' +
      (x.error ? '<button class="btn btn-ghost btn-mini" type="button" data-qi="' + i + '">Quitar</button>' : '<span class="chip warn">Pendiente</span>') + '</div>').join('') + '</div>' : '<div class="vacio">No hay nada pendiente.</div>') +
    '<div class="campos" style="margin-top:14px"><button class="btn btn-prim" type="button" id="colaYa">Enviar ahora</button></div>';
  $('panel').hidden = false;
  $('cerrar').onclick = () => { $('panel').hidden = true; };
  $('colaYa').onclick = async () => { COLA.forEach(x => delete x.error); guardarCola(); await sincronizarCola(); abrirCola(); };
  $('panelIn').querySelectorAll('[data-qi]').forEach(b => b.onclick = () => {
    const x = COLA[+b.dataset.qi];
    if (!confirm('¿Quitar "' + (nom[x.fn] || x.fn) + (x.desc ? ' · ' + x.desc : '') + '"? No se va a registrar.')) return;
    COLA.splice(+b.dataset.qi, 1); guardarCola(); abrirCola();
  });
}

/* ---------- Datos guardados en el celular (abre al instante) ---------- */
let DATOS_T = 0;
function guardarCache() { try { if (D && SES) localStorage.setItem(DATOS_K, JSON.stringify({ u: SES.token.slice(0, 16), t: Date.now(), D: D })); } catch (e) { } }
function leerCache() { try { const c = JSON.parse(localStorage.getItem(DATOS_K) || 'null'); if (c && SES && c.u === SES.token.slice(0, 16)) return c; } catch (e) { } return null; }
function refrescarDatos() { return srv('appInicio').then(d => { D = d; DATOS_T = Date.now(); guardarCache(); return d; }).catch(() => null); }
function pedirPin(msg) {
  $('login').hidden = false; $('pin').value = '';
  $('loginMsg').innerHTML = msg ? '<div class="aviso warn">' + esc(msg) + '</div>' : '';
  setTimeout(() => $('pin').focus(), 50);
}
$('loginForm').onsubmit = async e => {
  e.preventDefault();
  const pin = $('pin').value.replace(/\D/g, ''), b = $('btnEntrar');
  if (pin.length < 4) { $('loginMsg').innerHTML = '<div class="aviso bad">El PIN tiene al menos 4 números.</div>'; return; }
  b.disabled = true; b.textContent = 'Entrando…';
  try {
    const r = await run('entrar', [pin]);
    guardarSesion({ token: r.token, nombre: r.nombre, rol: r.rol });
    $('login').hidden = true; $('pin').value = '';
    pintarQuien(); cargar();
  } catch (err) { $('loginMsg').innerHTML = '<div class="aviso bad">' + esc(errorTexto(err)) + '</div>'; $('pin').value = ''; $('pin').focus(); }
  finally { b.disabled = false; b.textContent = 'Entrar'; }
};
function pintarQuien() {
  const q = $('quien'); if (!SES) { q.hidden = true; return; }
  const rol = (D && D.rol) || SES.rol;
  q.hidden = false; q.innerHTML = esc(SES.nombre) + (rol === 'empleada' ? ' · empleada' : '') + ' ·<button type="button" id="btnSalir">Salir</button>';
  $('btnSalir').onclick = () => {
    if (!confirm('¿Salir de la App? Para volver a entrar se necesita el PIN.')) return;
    run('salir', [SES.token]).catch(() => { });
    if (COLA.some(x => !x.error) && !confirm('Hay ' + COLA.filter(x => !x.error).length + ' movimiento(s) sin enviar. Se mandarán cuando la siguiente persona entre con su PIN. ¿Salir?')) return;
    guardarSesion(null); D = null; q.hidden = true;
    try { localStorage.removeItem(DATOS_K); } catch (e) { }
    // Que la siguiente persona no vea nada de la sesión anterior
    nueva = null; filtro = ''; tab = 'hoy';
    try { P = { seg: 'toca', valor: '', plantilla: 'Te toca tratamiento', mensaje: '', lista: null, camp: null, envio: null, nombre: '' }; } catch (e) { }
    try { AG = { fecha: '', cache: {} }; } catch (e) { }
    try { INV = { q: '', filtro: 'todos' }; } catch (e) { }
    $('panel').hidden = true; $('vista').innerHTML = ''; pedirPin();
  };
}
function wa(tel, txt) { const t = String(tel || '').replace(/\D/g, '').slice(-10); return t.length === 10 ? 'https://wa.me/52' + t + (txt ? '?text=' + encodeURIComponent(txt) : '') : ''; }
function sumaDias(isoS, n) { const d = new Date(isoS + 'T12:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function errorTexto(e) {
  const m = String(e && e.message || e);
  if (/NetworkError|network|Failed to fetch|conexi/i.test(m)) return 'Sin conexión a internet. Revisa tu señal y vuelve a intentar.';
  if (/Authorization is required|autorizaci|permission|permiso/i.test(m)) return 'La App necesita que la dueña la autorice otra vez (correr "autorizar" en el editor).';
  return m.replace(/^(Exception|Error):\s*/, '').replace(/^SESION:\s*/, '');
}

/* ---------- Carga ---------- */
/** Se puede repintar sin estorbar: nadie está escribiendo ni en un cobro a medias. */
function puedeRepintar() {
  const a = document.activeElement;
  if (!$('panel').hidden) return false;
  if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && $('vista').contains(a)) return false;
  if (tab === 'registrar' && nueva && !nueva.res) return false;
  return true;
}
async function cargar() {
  $('estado').innerHTML = '';
  if (!SES) { pedirPin(); return; }
  let deCache = false;
  if (!D) {
    const c = leerCache();
    if (c && c.D) { D = c.D; DATOS_T = c.t; deCache = true; $('marca').textContent = D.negocio; pintarQuien(); render(); }
  }
  $('btnRecargar').textContent = 'Actualizando…';
  try {
    const d = await srv('appInicio');
    D = d; DATOS_T = Date.now(); guardarCache();
    $('marca').textContent = D.negocio;
    if (SES && D.rol && SES.rol !== D.rol) guardarSesion(Object.assign({}, SES, { rol: D.rol }));
    AG.cache = {}; pintarQuien();
    if (!deCache || puedeRepintar()) render();
    sincronizarCola();
  } catch (e) {
    if (D && e.red) {
      const h = new Date(DATOS_T).toLocaleTimeString('es-MX', { hour: 'numeric', minute: '2-digit' });
      $('estado').innerHTML = '<div class="aviso warn">Sin señal: estás viendo los datos de las ' + esc(h) + '. Los cobros se guardan y se mandan solos cuando regrese el internet.</div>';
    } else $('estado').innerHTML = '<div class="aviso bad">' + esc(errorTexto(e)) + '</div>';
    if (!D) $('vista').innerHTML = '<div class="seccion"><h2>Tus pendientes de hoy</h2><div class="vacio">Aquí aparecerán cumpleaños, citas, tratamientos que tocan y recompras en cuanto la app pueda leer la hoja. Toca Actualizar para reintentar.</div></div>';
  } finally { $('btnRecargar').textContent = 'Actualizar'; }
}
function render() {
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  if (!D) return;
  ({ hoy: vHoy, agenda: vAgenda, clientas: vClientas, registrar: vRegistrar, promos: vPromos, inventario: vInventario })[tab]();
  window.scrollTo(0, 0);
}

/* ---------- Agenda ---------- */
let AG = { fecha: '', cache: {} };
const DIAS_C = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const MESES_C = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const fechaD = iso => new Date(iso + 'T12:00:00');
function lunesDe(iso) { const d = fechaD(iso), w = (d.getDay() + 6) % 7; return sumaDias(iso, -w); }
function fechaLargaC(iso) {
  const d = fechaD(iso), dif = Math.round((d - fechaD(D.hoy)) / 864e5);
  const base = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'][d.getDay()] + ' ' + d.getDate() + ' de ' + MESES_C[d.getMonth()];
  return dif === 0 ? 'Hoy, ' + base : dif === 1 ? 'Mañana, ' + base : dif === -1 ? 'Ayer, ' + base : base.charAt(0).toUpperCase() + base.slice(1);
}
async function citasSemana(lunes, forzar) {
  if (!forzar && AG.cache[lunes]) return AG.cache[lunes];
  AG.cache[lunes] = await srv('listarCitas', lunes, sumaDias(lunes, 6));
  return AG.cache[lunes];
}
function refrescarCitas() {
  AG.cache = {};
  srv('listarCitas', D.hoy, sumaDias(D.hoy, 1)).then(l => { D.citas = l; if (tab === 'hoy') vHoy(); }).catch(() => { });
  if (tab === 'agenda') vAgenda();
}
async function vAgenda() {
  if (!AG.fecha) AG.fecha = D.hoy;
  const lunes = lunesDe(AG.fecha);
  const pinta = lista => {
    if (tab !== 'agenda') return;
    const dias = Array.from({ length: 7 }, (_, i) => sumaDias(lunes, i));
    const cuenta = f => lista ? lista.filter(c => c.fecha === f && VIVAS(c)).length : 0;
    const delDia = lista ? lista.filter(c => c.fecha === AG.fecha) : null;
    const d0 = fechaD(lunes), d6 = fechaD(dias[6]);
    let h = '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:6px"><h2 style="font-family:var(--f-display);font-weight:400;font-size:19px;color:var(--ciruela)">' +
      esc(MESES_C[d0.getMonth()].charAt(0).toUpperCase() + MESES_C[d0.getMonth()].slice(1) + (d0.getMonth() !== d6.getMonth() ? ' – ' + MESES_C[d6.getMonth()] : '') + ' ' + d6.getFullYear()) +
      '</h2>' + (AG.fecha !== D.hoy ? '<button class="linkbtn" type="button" id="aHoy">Ir a hoy</button>' : '') + '</div>';
    h += '<div class="semana"><button class="flecha" type="button" id="aPrev" aria-label="Semana anterior">‹</button>' + dias.map(f => {
      const d = fechaD(f), n = cuenta(f);
      return '<button type="button" class="dia' + (f === D.hoy ? ' hoy' : '') + '" data-f="' + f + '" aria-pressed="' + (f === AG.fecha) + '"><span class="dn">' + DIAS_C[d.getDay()] + '</span><span class="dd">' + d.getDate() + '</span><span class="dc">' + (n ? n : '') + '</span></button>';
    }).join('') + '<button class="flecha" type="button" id="aNext" aria-label="Semana siguiente">›</button></div>';
    h += '<section class="seccion"><h2>' + esc(fechaLargaC(AG.fecha)) + (delDia ? '<span class="n">' + delDia.filter(VIVAS).length + '</span>' : '') + '</h2><div class="lista" id="al">' +
      (!delDia ? '<div class="carga"><span class="spin"></span>Cargando citas…</div>' : delDia.length ? delDia.map(c => filaCita(c)).join('') : '<div class="vacio">No hay citas este día.</div>') + '</div></section>';
    h += '<button class="btn btn-prim" type="button" id="aNueva" style="width:100%;padding:13px;margin-top:14px">+ Agendar cita' + (AG.fecha !== D.hoy ? ' el ' + isoMx(AG.fecha).slice(0, 5) : '') + '</button>';
    $('vista').innerHTML = h;
    ligarCitas($('vista'));
    $('vista').querySelectorAll('.dia').forEach(b => b.onclick = () => { AG.fecha = b.dataset.f; pinta(lista); });
    $('aPrev').onclick = () => { AG.fecha = sumaDias(AG.fecha, -7); vAgenda(); };
    $('aNext').onclick = () => { AG.fecha = sumaDias(AG.fecha, 7); vAgenda(); };
    if ($('aHoy')) $('aHoy').onclick = () => { AG.fecha = D.hoy; vAgenda(); };
    $('aNueva').onclick = () => abrirFormCita(null, { fecha: AG.fecha < D.hoy ? D.hoy : AG.fecha });
  };
  pinta(AG.cache[lunes] || null);
  if (!AG.cache[lunes]) {
    try { pinta(await citasSemana(lunes)); }
    catch (e) { if (tab === 'agenda' && $('al')) $('al').innerHTML = '<div class="aviso bad">' + esc(errorTexto(e)) + '</div>'; }
  }
}
